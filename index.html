 id="en2"></i></div></div><div class="portrait speed"></div></div></section><div class="vs">VS</div><div id="status" class="status"></div><div id="combo" class="combo"></div><div id="f1" class="fighter" style="left:21%"><i class="shadow"></i><div class="sprite"><i class="part head"></i><i class="part hair"></i><i class="part neck"></i><i class="part shoulder l"></i><i class="part shoulder r"></i><i class="part body"></i><i class="part arm l"></i><i class="part arm r"></i><i class="part belt"></i><i class="part leg l"></i><i class="part leg r"></i><i class="part boot l"></i><i class="part boot r"></i><b class="label"></b></div></div><div id="f2" class="fighter p2" style="left:69%"><i class="shadow"></i><div class="sprite"><i class="part head"></i><i class="part hair"></i><i class="part neck"></i><i class="part shoulder l"></i><i class="part shoulder r"></i><i class="part body"></i><i class="part arm l"></i><i class="part arm r"></i><i class="part belt"></i><i class="part leg l"></i><i class="part leg r"></i><i class="part boot l"></i><i class="part boot r"></i><b class="label"></b></div></div><div class="spectator"></div><div id="overlay" class="overlay"><h1>争霸赛</h1><p>两个 AI · 自动格斗 · 纯观战</p><button id="start" class="start">开始观战</button></div><script>(()=>{const $=id=>document.getElementById(id),G=document.querySelector('.game');const cfg={power:{speed:.48,reach:17,atk:[['轻拳',7,15,.12,.22,.38],['重拳',13,17,.20,.30,.72],['重脚',11,18,.18,.32,.62]],special:['烈焰冲击',24,22,.30,.22,1.55],style:'aggressive'},speed:{speed:.68,reach:17,atk:[['轻拳',6,15,.08,.18,.28],['重拳',10,17,.15,.25,.55],['重脚',9,19,.12,.25,.48]],special:['疾风连闪',19,23,.18,.30,1.25],style:'evasive'}};const names={idle:'观察对手',approach:'寻找距离',attack:'轻拳',heavy:'重拳',kick:'重脚',special:'必杀技',guard:'防御',dodge:'闪避',jump:'跳跃',hurt:'受击',ko:'KO'};function make(id,x,kind){return{id,x,hp:100,en:0,kind,face:id===1?1:-1,state:'idle',action:null,cool:0,stun:0,guard:0,dodge:0,jump:0,combo:0,comboT:0}}const A=make(1,21,'power'),B=
