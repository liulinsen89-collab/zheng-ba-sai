</style></head><body><main class="game"><div class="scene sky"></div><div class="scene moon"></div><div class="scene mountain"></div><div class="scene palace"><i class="roof"></i><i class="hall"></i></div><div class="scene waterfall"></div><div class="scene mist"></div><div class="scene cherry left"></div><div class="scene cherry right"></div><div class="scene lantern l"></div><div class="scene lantern r"></div><div class="scene banner l"></div><div class="scene banner r"></div><div class="scene platform"></div><div class="scene floor"></div><section class="hud"><div class="hudbox"><div class="portrait"></div><div><div class="name">赤焰 · 力量型 AI</div><div class="bar"><div id="hp1" class="hp"></div></div><div class="energy"><i id="en1"></i></div></div></div><div class="center"><div id="timer" class="timer">99</div></div><div class="hudbox r"><div><div class="name r">疾风 · 速度型 AI</div><div class="bar rbar"><div id="hp2" class="hp"></div></div><div class="energy renergy"><i id="en2"></i></div></div><div class="portrait speed"></div></div></section><div class="vs">VS</div><div id="status" class="status"></div><div id="combo" class="combo"></div><div id="f1" class="fighter" style="left:0"><i class="shadow"></i><div class="sprite"><i class="part hair"></i><i class="part bang"></i><i class="part head"></i><i class="part neck"></i><i class="part collar"></i><i class="part shoulder l"></i><i class="part shoulder r"></i><i class="part coat"></i><i class="part torso"></i><i class="part arm l"></i><i class="part arm r"></i><i class="part belt"></i><i class="part leg l"></i><i class="part leg r"></i><i class="part shin l"></i><i class="part shin r"></i><i class="part boot l"></i><i class="part boot r"></i><i class="part scarf"></i><i class="part emblem">火</i></div></div><div id="f2" class="fighter p2" style="left:0"><i class="shadow"></i><div class="sprite"><i class="part hair"></i><i class="part bang"></i><i class="part head"></i><i class="part neck"></i><i class="part collar"></i><i class="part shoulder l"></i><i class="part shoulder r"></i><i class="part coat"></i><i class="part torso"></i><i class="part arm l"></i><i class="part arm r"></i><i class="part belt"></i><i class="part leg l"></i><i class="part leg r"></i><i class="part shin l"></i><i class="part shin r"></i><i class="part boot l"></i><i class="part boot r"></i><i class="part scarf"></i><i class="part emblem">风</i></div></div><div class="spectator"></div><div id="overlay" class="overlay"><h1>争霸赛</h1><p>两个 AI · 自动格斗 · 纯观战</p><button id="start" class="start">开始观战</button></div><script>(()=>{const $=id=>document.getElementById(id),G=document.querySelector('.game');const cfg={power:{speed:.48,reach:17,atk:[['轻拳',7,15,.12,.22,.38],['重拳',13,17,.20,.30,.72],['轻脚',8,18,.13,.24,.46],['重脚',11,19,.18,.32,.62]],special:['烈焰冲击',24,22,.30,.22,1.55],style:'aggressive'},speed:{speed:.68,reach:17,atk:[['轻拳',6,15,.08,.18,.28],['重拳',10,17,.15,.25,.55],['轻脚',7,19,.10,.20,.34],['重脚',9,20,.12,.25,.48]],special:['疾风连闪',19,23,.18,.30,1.25],style:'evasive'}};const names={idle:'观察对手',approach:'寻找距离',attack:'轻拳',heavy:'重拳',lightkick:'轻脚',kick:'重脚',special:'特殊技',guard:'防御',dodge:'闪避',jump:'跳跃',hurt:'受击',ko:'KO'};function make(id,x,kind){return{id,x,hp:600,en:0,kind,face:id===1?1:-1,state:'idle',action:null,cool:0,stun:0,guard:0,dodge:0,jump:0,combo:0,comboT:0,stuck:0,sideSwitch:0}}const A=make(1,14,'power'),B=make(2,86,'speed');let running=false,time=99,last=0,raf=0,fxs=[],shake=0;function node(f){return $(f.id===1?'f1':'f2')}function gap(){return Math.abs(A.x-B.x)}function visual(f,...c){const n=node(f).querySelector('.sprite');n.classList.remove('att','heavy','kick','lightkick','guard','dodge','jump','hurt','ko','special');c.filter(Boolean).forEach(x=>n.classList.add(x))}function effect(x,y,text,cls='hit',life=.65){const e=document.createElement('div');e.className=cls;e.textContent=text;e.style.left=x+'%';e.style.top=y+'%';G.appendChild(e);fxs.push({e,t:life})}function burst(x,y,big=false){effect(x,y,big?'✹':'✦','hit',big?.38:.25);const r=document.createElement('div');r.className='ring';r.style.left=x+'%';r.style.top=y+'%';G.appendChild(r);fxs.push({e:r,t:.36});for(let i=0;i<(big?8:4);i++){const d=document.createElement('div');d.className='debris';d.textContent=i%2?'•':'✦';d.style.left=x+'%';d.style.top=y+'%';d.style.setProperty('--dx',((Math.random()-.5)*(big?90:55))+'px');d.style.setProperty('--dy',((Math.random()-.5)*(big?70:45))+'px');G.appendChild(d);fxs.push({e:d,t:.44})}}function showCombo(f){if(f.combo<2)return;const e=$('combo');e.textContent=f.combo>=5?'5 HIT COMBO':f.combo>=3?'3 HIT COMBO':f.combo+' HIT COMBO';e.classList.remove('show');void e.offsetWidth;e.classList.add('show')}function clearAction(f){f.action=null;visual(f)}function begin(f,type,m){if(f.action||f.stun>0||f.cool>0||f.hp<=0)return false;f.state=type;f.action={n:m[0],d:m[1],r:m[2],w:m[3],a:m[4],t:0,hit:false,max:m[3]+m[4]+.34};f.cool=m[5];visual(f,type);return true}/* ENERGY_OVERDRIVE_V1 */ /* ENERGY_TUNING_V2 */ /* SPECIAL_EFFECTS_V1 */function specialFX(f,e){const fire=f.id===1,kind=fire?'fire':'wind',x=e.x,y=48;visual(f,'special','fx-active');const flash=document.createElement('div');flash.className='special-flash';G.appendChild(flash);fxs.push({e:flash,t:.18});const title=document.createElement('div');title.className='special-title '+kind;title.textContent=f.id===1?'烈焰冲击':'疾风连闪';G.appendChild(title);fxs.push({e:title,t:.72});const c=document.createElement('div');c.className='special-charge '+kind;c.style.left=x+'%';c.style.top=y+'%';G.appendChild(c);fxs.push({e:c,t:.5});const ring=document.createElement('div');ring.className='special-ring '+kind;ring.style.left=x+'%';ring.style.top=y+'%';G.appendChild(ring);fxs.push({e:ring,t:.54});const beam=document.createElement('div');beam.className='special-beam '+kind;beam.style.left=(fire?Math.max(3,x-4):Math.min(97,x+4))+'%';beam.style.top=y+'%';beam.style.width=(fire?48:48)+'%';beam.style.transform=fire?'rotate(0deg)':'rotate(180deg)';G.appendChild(beam);fxs.push({e:beam,t:.38});shake=Math.max(shake,.34);time=Math.max(0,time-.3)}

function strike(f,e){const a=f.action;if(!a||a.hit||e.hp<=0)return;if(e.dodge>0||e.jump>0||gap()>a.r)return;a.hit=true;const blocked=e.guard>0,baseDmg=blocked?Math.max(1,Math.round(a.d*.18)):a.d,isSpecial=a.n==='烈焰冲击'||a.n==='疾风连闪',counter=!blocked&&!isSpecial&&!!e.action&&e.action.t<e.action.w,dmg=isSpecial?210:Math.max(1,Math.round(baseDmg*(counter?0.62:.5)));if(isSpecial)specialFX(f,e);if(counter)effect(e.x,40,'COUNTER','counter',.72);e.hp=Math.max(0,e.hp-dmg);e.stun=blocked?.08:(a.d>=20?.32:.20);e.state=e.hp<=0?'ko':blocked?'guard':'hurt';if(!blocked)visual(e,'hurt');else visual(e,'guard');f.en=Math.min(100,f.en+(blocked?.35:Math.max(.15,baseDmg*.20)));f.combo++;f.comboT=1.05;e.combo=0;e.comboT=0;burst(e.x,48,a.d>=20);effect(e.x,53,blocked?'GUARD':'-'+dmg);if(isSpecial){const sd=document.createElement('div');sd.className='special-damage';sd.textContent='-'+dmg;sd.style.left=Math.max(8,Math.min(86,e.x))+'%';sd.style.top='54%';G.appendChild(sd);fxs.push({e:sd,t:.74})}if(a.n==='烈焰冲击'||a.n==='疾风连闪')burst(e.x,46,true);shake=Math.max(shake,a.d>=20?.18:.09);if(a.d>=20)time=Math.max(0,time-.12);showCombo(f);clearAction(f)}function utilityScore(f,e,a,q,c,low,enemyLow,incoming){const s=c.style;let v=Math.random()*1.5;if(a==='attack'){v+=q<22?5:1;v+=s==='aggressive'?3:1.5;if(enemyLow)v+=2}if(a==='heavy'){v+=q<18?6:.5;v+=s==='aggressive'?4:1;if(enemyLow)v+=2.5;v-=q>28?4:0}if(a==='lightkick'){v+=q<24?4:1;v+=s==='evasive'?1.5:0}if(a==='kick'){v+=q<30?3:0;v+=enemyLow?3:0}if(a==='guard'){v+=incoming?(s==='aggressive'?3:7):0;v+=low?2:0}if(a==='dodge'){v+=incoming?(s==='evasive'?9:4):0;v+=low?3:0;v+=q<18?2:0}if(a==='jump'){v+=(s==='evasive'&&low)?7:1;v+=incoming?3:0}if(a==='special'){v+=f.en>=100?5:0;v+=enemyLow?7:0;v+=q<20?5:0;v+=s==='aggressive'?3:1}if(s==='evasive'){if(q<13&&a==='dodge')v+=5;if(q>25&&a==='attack')v-=2;if(q>25&&a==='heavy')v-=3;if(low&&(a==='guard'||a==='dodge'))v+=3}else{if(q>c.reach+2&&(a==='attack'||a==='heavy'))v-=3;if(q<c.reach+2&&a==='attack')v+=2;if(low&&a==='special')v+=3}return v}
