()>a.r)return;a.hit=true;const blocked=e.guard>0,baseDmg=blocked?Math.max(1,Math.round(a.d*.18)):a.d,dmg=Math.max(1,Math.round(baseDmg*.5));e.hp=Math.max(0,e.hp-dmg);e.stun=blocked?.08:(a.d>=20?.32:.20);e.state=e.hp<=0?'ko':blocked?'guard':'hurt';if(!blocked)visual(e,'hurt');else visual(e,'guard');f.en=Math.min(100,f.en+(blocked?2:baseDmg*1.35));f.combo++;f.comboT=1.05;e.combo=0;e.comboT=0;burst(e.x,48,a.d>=20);effect(e.x,53,blocked?'GUARD':'-'+dmg);if(a.n==='烈焰冲击'||a.n==='疾风连闪')burst(e.x,46,true);shake=Math.max(shake,a.d>=20?.18:.09);if(a.d>=20)time=Math.max(0,time-.12);showCombo(f);clearAction(f)}function decide(f,e){if(f.action||f.stun>0||f.cool>0||f.hp<=0)return;const q=gap(),c=cfg[f.kind],style=c.style,incoming=['attack','heavy','lightkick','kick','special'].includes(e.state);if(incoming&&q<25){const guardChance=style==='aggressive'?.10:.20,dodgeChance=style==='evasive'?.24:.12;if(Math.random()<guardChance){f.guard=style==='aggressive'?.28:.42;f.state='guard';visual(f,'guard');f.cool=.35;return}if(style==='evasive'&&Math.random()<dodgeChance){f.dodge=.28;f.state='dodge';f.x=Math.max(8,Math.min(92,f.x+f.face*3.5));visual(f,'dodge');f.cool=.58;return}}if(q>c.reach){f.state='approach';f.x+=f.face*c.speed*(style==='aggressive'?1.05:1);return}if(q<9){f.state='approach';f.x-=f.face*(style==='evasive'?.85:.55);return}if(f.en>=100&&q<c.special[2]&&Math.random()<(style==='aggressive'?.48:.34)){f.en=0;begin(f,'special',c.special);return}if(style==='evasive'&&Math.random()<.13){f.state='jump';f.jump=.42;visual(f,'jump');f.cool=.58;return}const arr=c.atk;let r=Math.random();if(style==='aggressive')r=Math.min(1,r+.08);const m=r<.40?arr[0]:r<.63?arr[1]:r<.82?arr[2]:arr[3];const type=m===arr[0]?'attack':m===arr[1]?'heavy':m===arr[2]?'lightkick':'kick';begin(f,type,m)}function update(f,e,dt){f.cool=Math.max(0,f.cool-dt);f.stun=Math.max(0,f.stun-dt);f.guard=Math.max(0,f.guard-dt);f.dodge=Math.max(0,f.dodge-dt);f.jump=Math.max(0,f.jump-dt);f.comboT=Math.max(0,f.comboT-dt);if(!f.comboT)f.combo=0;if(f.hp<=0){f.state='ko';f.action=null;visual(f,'ko');return}if(f.guard<=0&&f.state==='guard')visual(f);if(f.dodge<=0&&f.state==='dodge')visual(f);if(f.jump<=0&&f.state==='jump')visual(f);if(f.stun>0)return;if(f.action){f.action.t+=dt;const a=f.action;if(a.t>=a.w&&a.t<a.w+a.a)strike(f,e);if(f.action&&a.t>=a.max)clearAction(f)}else if(f.guard<=0&&f.dodge<=0&&f.jump<=0){if(['hurt','guard','dodge','jump','ko'].includes(f.state))f.state='idle';decide(f,e)}}function resetF(f,x){f.x=x;f.hp=600;f.en=0;f.face=f.id===1?1:-1;f.state='idle';f.action=null;f.cool=0;f.stun=0;f.guard=0;f.dodge=0;f.jump=0;f.combo=0;f.comboT=0;visual(f)}function render(){$('hp1').style.width=Math.max(0,Math.min(100,A.hp/600*100))+'%';$('hp2').style.width=Math.max(0,Math.min(100,B.hp/600*100))+'%';$('en1').style.width=A.en+'%';$('en2').style.width=B.en+'%';$('timer').textContent=Math.ceil(time);$('timer').classList.toggle('low',time<10);node(A).style.left='calc('+A.x+'% - 105px)';node(B).style.left='calc('+B.x+'% - 105px)';if(shake>0){const n=(Math.random()-.5)*shake*100;G.style.transform='translate('+n+'px,'+(n*.45)+'px)'}else G.style.transform=''}function separate(){const d=B.x-A.x;if(Math.abs(d)<11){const s=(11-Math.abs(d))/2;if(d>=0){A.x-=s;B.x+=s}else{A.x+=s;B.x-=s}A.x=Math.max(14,Math.min(86,A.x));B.x=Math.max(14,Math.min(86,B.x))}}function end(){running=false;cancelAnimationFrame(raf);const w=A.hp===B.hp?'平局':A.hp>B.hp?'赤焰胜利！':'疾风胜利！';$('overlay').innerHTML='<h1>'+w+'</h1><p>本场 AI 对决结束</p><button id="start" class="start">再战一场</button>';$('overlay').style.display='flex';$('start').onclick=start}function loop(ts){if(!running)return;const dt=Math.min(.05,(ts-last)/1000||0);last=ts;time=Math.max(0,time-dt);shake=Math.max(0,shake-dt);A.face=B.x>=A.x?1:-1;B.face=A.x>=B.x?1:-1;update(A,B,dt);update(B,A,dt);separate();fxs=fxs.filter(o=>{o.t-=dt;if(o.t<=0){o.e.remove();return false}return true});render();if(time<=0||A.hp<=0||B.hp<=0){end();return}raf=requestAnimationFrame(loop)}function callout(f){if(!running||f.hp<=0)return;const label=names[f.state]||'';if(!label||['idle','approach','hurt','ko'].includes(f.state))return;const e=document.createElement('div');e.className='action-callout '+(f.id===1?'f1':'f2');e.textContent=label;const r=node(f).getBoundingClientRect(),gr=G.getBoundingClientRect();e.style.left=(r.left+r.width/2-gr.left)/gr.width*100+'%';e.style.top=Math.max(8,(r.top-gr.top)/gr.height*100-5)+'%';G.appendChild(e);setTimeout(()=>e.remove(),450)}let lastState={1:'idle',2:'idle'};function calloutWatch(){[A,B].forEach(f=>{if(f.state!==lastState[f.id]){lastState[f.id]=f.state;callout(f)}})}const oldRender=render;render=function(){oldRender();calloutWatch()};let openingLockUntil=0;const realDecide=decide;decide=function(f,e){if(performance.now()<openingLockUntil){f.vx=0;return}return realDecide(f,e)};function start(){fxs.forEach(o=>o.e.remove());fxs=[];shake=0;G.style.transform='';resetF(A,14);resetF(B,86);A.x=14;B.x=86;openingLockUntil=performance.now()+1000;lastState={1:'idle',2:'idle'};time=99;last=performance.now();$('overlay').style.display='none';document.querySelector('.vs').style.display='none';running=true;cancelAnimationFrame(raf);render();raf=requestAnimationFrame(loop)}$('start').onclick=start;resetF(A,14);resetF(B,86);render()})();</script></main></body></html>
