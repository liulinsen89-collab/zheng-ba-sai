<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>争霸赛 · AI Fighting Arena</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#111;color:#fff;font-family:system-ui,"Microsoft YaHei",sans-serif}body{display:flex;align-items:center;justify-content:center}.game{position:relative;width:100vw;height:56.25vw;max-width:1200px;max-height:675px;overflow:hidden;background:linear-gradient(#18253b 0 42%,#29364b 42% 67%,#171717 67%)}.sky{position:absolute;inset:0;background:radial-gradient(circle at 50% 22%,#556985 0 4%,transparent 5%),linear-gradient(180deg,#101a2a,#3c4b63 62%,#222);opacity:.95}.lights{position:absolute;top:7%;left:0;right:0;height:30%;background:repeating-linear-gradient(90deg,transparent 0 8%,rgba(255,255,255,.12) 8.2% 8.7%,transparent 9% 16%)}.crowd{position:absolute;top:39%;left:0;right:0;height:17%;background:radial-gradient(circle,#111 0 3%,transparent 4%) 0 0/28px 28px;opacity:.55}.floor{position:absolute;left:-10%;right:-10%;bottom:-16%;height:50%;background:linear-gradient(160deg,#252525,#080808);transform:perspective(450px) rotateX(54deg);transform-origin:center top;border-top:4px solid #888}.grid{position:absolute;left:0;right:0;bottom:12%;height:26%;background:repeating-linear-gradient(90deg,transparent 0 8%,rgba(255,255,255,.08) 8.2% 8.5%),repeating-linear-gradient(0deg,transparent 0 18%,rgba(255,255,255,.07) 18.2% 18.6%);transform:perspective(450px) rotateX(54deg)}.hud{position:absolute;z-index:5;top:18px;left:3%;right:3%;display:grid;grid-template-columns:1fr 100px 1fr;gap:14px;align-items:center}.name{font-weight:900;font-size:clamp(14px,2vw,24px);text-shadow:3px 3px #000}.name.right{text-align:right}.bar{height:25px;border:3px solid #fff;background:#171717;box-shadow:0 3px 0 #000}.hp{height:100%;background:#e9d83d;transition:width .15s}.rightbar .hp{margin-left:auto;background:#e95a5a}.timer{font-size:clamp(25px,4vw,44px);font-weight:900;text-align:center;text-shadow:3px 3px #000}.vs{position:absolute;top:70px;left:50%;transform:translateX(-50%) skew(-10deg);font-size:clamp(25px,4vw,48px);font-weight:1000;color:#f5d34b;text-shadow:4px 4px #000;z-index:6}.fighter{position:absolute;z-index:4;bottom:22%;width:80px;height:150px;transition:transform .06s}.fighter .shadow{position:absolute;bottom:-8px;left:-15px;width:110px;height:22px;border-radius:50%;background:#0008}.body{position:absolute;left:25px;bottom:28px;width:42px;height:75px;border:4px solid #111;border-radius:10px 10px 5px 5px;background:#b33}.head{position:absolute;left:27px;bottom:98px;width:38px;height:38px;border:4px solid #111;border-radius:50%;background:#e2a071}.leg{position:absolute;bottom:0;width:17px;height:45px;border:4px solid #111;background:#333}.lleg{left:24px}.rleg{left:51px}.arm{position:absolute;top:54px;width:45px;height:16px;border:4px solid #111;border-radius:8px;background:#c34}.larm{left:-12px;transform:rotate(20deg)}.rarm{right:-13px;transform:rotate(-20deg)}.speed .body{background:#3e78d0}.speed .arm{background:#477fe0}.power .body{background:#b53b35}.attack{animation:punch .24s}.hit{animation:hit .18s}.guard .body,.guard .arm{filter:brightness(.7)}@keyframes punch{50%{transform:translateX(18px) scaleX(1.12)}}@keyframes hit{50%{transform:translateX(-14px) rotate(-8deg)}}.label{position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;text-shadow:2px 2px #000}.overlay{position:absolute;inset:0;z-index:10;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#0009;text-align:center}.overlay h1{font-size:clamp(34px,7vw,78px);margin:0;color:#f2d34e;text-shadow:5px 5px #000}.overlay p{font-size:18px}.start{padding:12px 28px;font-size:18px;font-weight:800;border:3px solid #fff;background:#222;color:#fff;cursor:pointer}.feed{position:absolute;z-index:7;top:112px;left:50%;transform:translateX(-50%);font-size:12px;opacity:.8;white-space:nowrap}.hint{position:absolute;bottom:12px;left:50%;transform:translateX(-50%);font-size:12px;opacity:.55;z-index:8}
</style></head>
<body><main class="game"><div class="sky"></div><div class="lights"></div><div class="crowd"></div><div class="floor"></div><div class="grid"></div><section class="hud"><div><div class="name">赤焰 · 力量型 AI</div><div class="bar"><div id="hp1" class="hp"></div></div></div><div id="timer" class="timer">99</div><div class="rightbar"><div class="name right">疾风 · 速度型 AI</div><div class="bar"><div id="hp2" class="hp" style="width:100%"></div></div></div></section><div class="vs">VS</div><div id="feed" class="feed">AI 正在分析战局……</div><div id="f1" class="fighter power" style="left:22%"><i class="shadow"></i><i class="head"></i><i class="body"></i><i class="leg lleg"></i><i class="leg rleg"></i><i class="arm larm"></i><i class="arm rarm"></i><b class="label">赤焰</b></div><div id="f2" class="fighter speed" style="left:70%"><i class="shadow"></i><i class="head"></i><i class="body"></i><i class="leg lleg"></i><i class="leg rleg"></i><i class="arm larm"></i><i class="arm rarm"></i><b class="label">疾风</b></div><div id="overlay" class="overlay"><h1>争霸赛</h1><p>AI × AI · 自动格斗观战原型</p><button id="start" class="start">开始观战</button></div><div class="hint">第一阶段原型 · 玩家无需操作</div></main><script>
const $=id=>document.getElementById(id);const A={x:22,hp:100,cool:0,hit:0},B={x:70,hp:100,cool:0,hit:0};let running=false,time=99,last=0,clock=0;
function dist(){return Math.abs(A.x-B.x)}
function act(f,enemy,kind){if(kind==='attack'){f.cool=kind==='special'?1.3:.65;enemy.hp=Math.max(0,enemy.hp-(kind==='heavy'?11:kind==='special'?18:7));$(f===A?'f1':'f2').classList.add('attack');setTimeout(()=>$(f===A?'f1':'f2').classList.remove('attack'),240);$(f===A?'feed':'feed').textContent=(f===A?'赤焰':'疾风')+' 使用 '+(kind==='special'?'必杀技':kind==='heavy'?'重拳':'连招');}else if(kind==='guard'){f.cool=.45;$(f===A?'f1':'f2').classList.add('guard');setTimeout(()=>$(f===A?'f1':'f2').classList.remove('guard'),350)}else if(kind==='dodge'){f.cool=.7;f.x+=f===A?-4:4}else if(kind==='jump'){f.cool=.8} }
function ai(f,e){if(f.cool>0)return;const d=dist();if(d>15){f.x+=f.x<e.x?0.55:-0.55;return}const r=Math.random();if(e.hit>0&&r<.35){act(f,e,'guard');return}if(r<.13){act(f,e,'dodge');return}if(r<.18){act(f,e,'jump');return}if(r<.35){act(f,e,'heavy');return}if(r<.45&&f.hp>35){act(f,e,'special');return}act(f,e,'attack')}
function render(){A.x=Math.max(8,Math.min(88,A.x));B.x=Math.max(12,Math.min(92,B.x));$('f1').style.left=A.x+'%';$('f2').style.left=B.x+'%';$('hp1').style.width=A.hp+'%';$('hp2').style.width=B.hp+'%';$('timer').textContent=Math.ceil(time)}
function loop(ts){if(!running)return;const dt=Math.min(.05,(ts-last)/1000||0);last=ts;clock+=dt;time-=dt;if(time<=0||A.hp<=0||B.hp<=0){running=false;const winner=A.hp===B.hp?'平局':A.hp>B.hp?'赤焰':'疾风';$('overlay').innerHTML='<h1>'+winner+'</h1><p>'+winner+' 赢得本场 AI 对决</p><button class="start" onclick="location.reload()">重新观战</button>';render();return}A.cool=Math.max(0,A.cool-dt);B.cool=Math.max(0,B.cool-dt);A.hit=Math.max(0,A.hit-dt);B.hit=Math.max(0,B.hit-dt);ai(A,B);ai(B,A);if(dist()<15&&Math.random()<dt*1.2){if(Math.random()<.5)B.hit=.2;else A.hit=.2}render();requestAnimationFrame(loop)}
$('start').onclick=()=>{$('overlay').style.display='none';running=true;last=performance.now();requestAnimationFrame(loop)};render();
</script></main></body></html>
