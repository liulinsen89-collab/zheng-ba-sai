:5px solid #111}.palace .hall:before{content:"";position:absolute;left:80px;top:20px;width:43px;height:100px;background:linear-gradient(#573a26,#171313);border:4px solid #0c0d10}.palace .hall:after{content:"✦  ✦  ✦";position:absolute;left:25px;top:12px;color:#ffd47b;letter-spacing:22px;font-size:14px}.waterfall{position:absolute;left:50%;top:46%;width:120px;height:115px;transform:translateX(-50%);background:linear-gradient(90deg,transparent,#a7d7ff55 35%,#e6f4ffcc 50%,#8ec9ff44 65%,transparent);filter:blur(3px)}.mist{left:0;right:0;top:47%;height:23%;background:radial-gradient(ellipse at 50% 55%,#d4e9ff22,transparent 65%),linear-gradient(transparent,#7da0c51c,transparent)}.cherry{top:4%;width:260px;height:230px;background:radial-gradient(circle at 18% 22%,#ff9fc5 0 9px,transparent 10px),radial-gradient(circle at 35% 12%,#ffc0d9 0 8px,transparent 9px),radial-gradient(circle at 54% 27%,#ff9fc5 0 10px,transparent 11px),radial-gradient(circle at 76% 17%,#ffc7dd 0 8px,transparent 9px),radial-gradient(circle at 30% 45%,#ffb1cf 0 9px,transparent 10px),radial-gradient(circle at 65% 48%,#ff9fca 0 10px,transparent 11px),linear-gradient(120deg,#19191d 0 8%,transparent 8%)}.cherry.left{left:-20px;transform:rotate(-7deg)}.cherry.right{right:-30px;transform:scaleX(-1) rotate(-4deg);opacity:.55}.lantern{top:43%;width:50px;height:80px;background:linear-gradient(#ffdd7a,#ff8b2a);border:5px solid #21160f;border-radius:8px;box-shadow:0 0 25px #ffb33b88}.lantern:before{content:"武";position:absolute;inset:12px 5px;color:#3a1b12;font-size:25px;font-weight:900;text-align:center}.lantern.l{left:2%}.lantern.r{right:2%}.banner{top:40%;width:48px;height:150px;background:#641f2c;border:3px solid #d6b276;box-shadow:8px 6px 0 #120f18}.banner:before{content:"武";position:absolute;top:27px;left:7px;font-size:31px;font-weight:900}.banner.l{left:6%}.banner.r{right:6%}.platform{left:0;right:0;bottom:0;height:43%;background:linear-gradient(180deg,#151a22,#080a0f 78%);clip-path:polygon(0 20%,100% 20%,10 .leg.l{left:43px}.leg.r{left:84px}.label{position:absolute;bottom:-30px;left:50%;transform:translateX(-50%);font-size:14px;font-weight:900;white-space:nowrap;text-shadow:2px 2px #000}.att .arm.r{animation:punch .18s steps(2)}.att .arm.l{animation:backArm .18s steps(2)}.att2 .leg.r{animation:kick .22s steps(2)}.att2 .body{animation:lunge .22s steps(2)}.hurt{animation:hurt .18s}.hurt .head{animation:headHit .18s}.dodge{animation:dodge .28s}.jump{animation:jump .42s}.jump .arm.l{animation:airL .42s}.jump .arm.r{animation:airR .42s}.jump .leg.l{animation:airLL .42s}.jump .leg.r{animation:airLR .42s}.ko{animation:ko .7s forwards}.guard .body{filter:brightness(.58)}.guard .arm.l{transform:rotate(-55deg)}.guard .arm.r{transform:rotate(55deg)}.guard:after{content:"🛡";position:absolute;left:92px;top:88px;font-size:30px;filter:drop-shadow(2px 2px #000)}.special .body{animation:charge .3s infinite alternate}.chargeText{position:absolute;z-index:45;font-weight:1000;color:#8de5ff;text-shadow:3px 3px #000;animation:up .6s forwards;pointer-events:none}.hit{position:absolute;z-index:46;font-size:42px;animation:spark .28s forwards;pointer-events:none}.ring{position:absolute;z-index:44;width:20px;height:20px;border:4px solid #fff;border-radius:50%;transform:translate(-50%,-50%);animation:ring .34s ease-out forwards;pointer-events:none}.debris{position:absolute;z-index:47;font-size:20px;animation:debris .42s ease-out forwards;pointer-events:none}.combo{position:absolute;z-index:48;left:4%;bottom:20%;font-size:clamp(18px,2.8vw,34px);font-weight:1000;color:#f3d04a;text-shadow:4px 4px #000;opacity:0}.combo.show{animation:comboIn .7s forwards}.spectator{position:absolute;z-index:38;left:50%;bottom:18px;transform:translateX(-50%);font-size:clamp(10px,1.2vw,14px);letter-spacing:2px;opacity:.55;text-shadow:2px 2px #000}.specialFlash{position:absolute;inset:0;z-index:35;background:#bfe7ff33;opacity:0;pointer-events:none}.specialFlash.on{animation:flash .18s ease-out}.overlay{position:absolute;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.72);text-align:center}.overlay h1{font-size:clamp(42px,7vw,84px);margin:0;color:#f1d24c;text-shadow:6px 6px #000}.overlay p{font-size:clamp(13px,2vw,20px);opacity:.9}.start{padding:12px 32px;border:3px solid #fff;background:#171a20;color:#fff;font-weight:900;font-size:18px}@keyframes punch{50%{transform:translateX(35px) rotate(-8deg) scaleX(1.18)}}@keyframes backArm{50%{transform:rotate(42deg)}}@keyframes kick{50%{transform:translate(28px,-12px) rotate(-34deg)}}@keyframes lunge{50%{transform:translateX(7px)}}@keyframes headHit{50%{transform:translateX(-6px) rotate(-8deg)}}@keyframes hurt{50%{transform:translateX(-24px) rotate(-7deg)}}@keyframes dodge{50%{transform:translateX(28px) scale(.9) rotate(-8deg)}}@keyframes jump{50%{transform:translateY(-68px) rotate(-2deg)}}@keyframes airL{50%{transform:rotate(-75deg)}}@keyframes airR{50%{transform:rotate(75deg)}}@keyframes airLL{50%{transform:rotate(-18deg)}}@keyframes airLR{50%{transform:rotate(18deg)}}@keyframes charge{to{filter:brightness(1.4) saturate(1.5)}}@keyframes ko{to{transform:rotate(82deg) translateY(30px);opacity:.7}}@keyframes up{to{transform:translateY(-45px);opacity:0}}@keyframes spark{to{transform:scale(1.8) rotate(15deg);opacity:0}}@keyframes ring{to{width:120px;height:120px;opacity:0;border-width:2px}}@keyframes debris{to{transform:translate(var(--dx),var(--dy)) scale(.5);opacity:0}}@keyframes comboIn{0%{opacity:0;transform:scale(.7)}30%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1)}}@keyframes flash{50%{opacity:1}100%{opacity:0}}@media(max-width:700px){.game{width:100vw;height:56.25vw}.hud{grid-template-columns:1fr 58px 1fr;gap:5px}.portrait{display:none}.hudbox,.hudbox.r{display:block}.fighter{transform:scale(.46)}.vs{top:50px}.status{top:105px}.spectator{bottom:8px;font-size:9px}.moon{width:65px;height:65px}.palace{transform:translateX(-50%) scale(.72);transform-origin:top center}.banner{height:105px;width:36px}.lantern{transform:scale(.7)}} </style></head><body><main class="game"><div class="scene sky"></div><div class="scene moon"></div><div class="scene mountain"></div><div class="scene palace"><i class="roof"></i><i class="hall"></i></div><div class="scene waterfall"></div><div class="scene mist"></div><div class="scene cherry left"></div><div class="scene cherry right"></div><div class="scene lantern l"></div><div class="scene lantern r"></div><div class="scene banner l"></div><div class="scene banner r"></div><div class="scene platform"></div><div class="scene floor"></div><section class="hud"><div class="hudbox"><div class="portrait"></div><div><div class="name">赤焰 · 力量型 AI</div><div class="bar"><div id="hp1" class="hp"></div></div><div class="energy"><i id="en1"></i></div></div></div><div class="center"><div id="timer" class="timer">99</div></div><div class="hudbox r"><div><div class="name r">疾风 · 速度型 AI</div><div class="bar rbar"><div id="hp2" class="hp"></div></div><div class="energy"><i id="en2"></i></div></div><div class="portrait speed"></div></div></section><div class="vs">VS</div><div id="status" class="status">AI 正在分析战局……</div><div id="combo" class="combo"></div><div id="f1" class="fighter" style="left:21%"><i class="shadow"></i><div class="sprite"><i class="part head"></i><i class="part hair"></i><i class="part body"></i><i class="part arm l"></i><i class="part arm r"></i><i class="part leg l"></i><i class="part leg r"></i><b class="label">赤焰</b></div></div><div id="f2" class="fighter p2" style="left:69%"><i class="shadow"></i><div class="sprite"><i class="part head"></i><i class="part hair"></i><i class="part body"></i><i class="part arm l"></i><i class="part arm r"></i><i class="part leg l"></i><i class="part leg r"></i><b class="label">疾风</b></div></div><div class="spectator">AI × AI · 自动战斗 · 纯观战</div><div id="overlay" class="overlay"><h1>争霸赛</h1><p>两个 AI · 自动格斗 · 纯观战</p><button id="start" class="start">开始观战</button></div><script>(()=>{const $=id=>document.getElementById(id),G=document.querySelector('.game');const cfg={power:{speed:.48,reach:17,atk:[['轻拳',7,15,.12,.22,.38],['重拳',13,17,.20,.30,.72],['重脚',11,18,.18,.32,.62]],special:['烈焰冲击',24,22,.30,.22,1.55],style:'aggressive'},speed:{speed:.68,reach:17,atk:[['轻拳',6,15,.08,.18,.28],['重拳',10,17,.15,.25,.55],['重脚',9,19,.12,.25,.48]],special:['疾风连闪',19,23,.18,.30,1.25],style:'evasive'}};const names={idle:'观察对手',approach:'寻找距离',attack:'轻拳',heavy:'重拳',kick:'重脚',special:'必杀技',guard:'防御',dodge:'闪避',jump:'跳跃',hurt:'受击',ko:'KO'};function make(id,x,kind){return{id,x,hp:100,en:0,kind,face:id===1?1:-1,state:'idle',action:null,cool:0,stun:0,guard:0,dodge:0,jump:0,combo:0,comboT:0}}const A=make(1,21,'power'),B=make(2,69,'speed');let running=false,time=99,last=0,raf=0,fxs=[],shake=0;function node(f){return $(f.id===1?'f1':'f2')}function gap(){return Math.abs(A.x-B.x)}function visual(f,...c){const n=node(f).querySelector('.sprite');n.classList.remove('att','att2','guard','dodge','jump','hurt','ko','special');c.filter(Boolean).forEach(x=>n.classList.add(x))}function effect(x,y,text,cls='chargeText',life=.65){const e=document.createElement('div');e.className=cls;e.textContent=text;e.style.left=x+'%';e.style.top=y+'%';G.appendChild(e);fxs.push({e,t:life})}function burst(x,y,big=false){effect(x,y,big?'✹':'✦','hit',big?.38:.25);const r=document.createElement('div');r.className='ring';r.style.left=x+'%';r.style.top=y+'%';G.appendChild(r);fxs.push({e:r,t:.36});for(let i=0;i<(big?8:4);i++){const d=document.createElement('div');d.className='debris';d.textContent=i%2?'•':'✦';d.style.left=x+'%';d.style.top=y+'%';d.style.setProperty('--dx',((Math.random()-.5)*(big?90:55))+'px');d.style.setProperty('--dy',((Math.random()-.5)*(big?70:45))+'px');G.appendChild(d);fxs.push({e:d,t:.44})}}function showCombo(f){if(f.combo<2)return;const e=$('combo');e.textContent=f.combo+' HIT!';e.classList.remove('show');void e.offsetWidth;e.classList.add('show')}function clearAction(f){f.action=null;visual(f)}function begin(f,type,m){if(f.action||f.stun>0||f.cool>0||f.hp<=0)return false;f.state=type;f.action={n:m[0],d:m[1],r:m[2],w:m[3],a:m[4],t:0,hit:false,max:m[3]+m[4]+.34};f.cool=m[5];visual(f,type==='attack'?'att':type==='heavy'||type==='kick'?'att2':type==='special'?'special':null);if(type==='special'){effect(f.x+f.face*2,38,'⚡');const fl=$('flash');fl.classList.add('on');setTimeout(()=>fl.classList.remove('on'),180)}return true}function strike(f,e){const a=f.action;if(!a||a.hit||e.hp<=0)return;if(e.dodge>0||e.jump>0||gap()>a.r)return;a.hit=true;const blocked=e.guard>0,dmg=blocked?Math.max(1,Math.round(a.d*.18)):a.d;e.hp=Math.max(0,e.hp-dmg);e.stun=blocked?.08:(a.d>=20?.32:.20);e.state=e.hp<=0?'ko':blocked?'guard':'hurt';if(!blocked){e.x=Math.max(8,Math.min(92,e.x+f.face*(a.d>=20?3:1.2)));visual(e,'hurt')}else visual(e,'guard');f.en=Math.min(100,f.en+(blocked?2:dmg*1.35));f.combo++;f.comboT=1.05;e.combo=0;e.comboT=0;burst(e.x,48,a.d>=20);effect(e.x,53,blocked?'GUARD':'-'+dmg);if(a.n==='烈焰冲击'||a.n==='疾风连闪')burst(e.x,46,true);shake=Math.max(shake,a.d>=20?.18:.09);if(a.d>=20)time=Math.max(0,time-.12);showCombo(f);clearAction(f)}function decide(f,e){if(f.action||f.stun>0||f.cool>0||f.hp<=0)return;const q=gap(),c=cfg[f.kind],style=c.style,incoming=['attack','heavy','kick','special'].includes(e.state);if(incoming&&q<25){const guardChance=style==='aggressive'?.10:.20,dodgeChance=style==='evasive'?.24:.12;if(Math.random()<guardChance){f.guard=style==='aggressive'?.28:.42;f.state='guard';visual(f,'guard');f.cool=.35;return}if(style==='evasive'&&Math.random()<dodgeChance){f.dodge=.28;f.state='dodge';f.x=Math.max(8,Math.min(92,f.x+f.face*3.5));visual(f,'dodge');f.cool=.58;return}}if(q>c.reach){f.state='approach';f.x+=f.face*c.speed*(style==='aggressive'?1.05:1);return}if(q<9){f.state='approach';f.x-=f.face*(style==='evasive'?.85:.55);return}if(f.en>=100&&q<c.special[2]&&Math.random()<(style==='aggressive'?.48:.34)){f.en=0;begin(f,'s
