<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>争霸赛 · AI × AI</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a0f;color:#fff;font-family:system-ui,"Microsoft YaHei",sans-serif}body{display:grid;place-items:center}.game{position:relative;width:100vw;height:56.25vw;max-width:1280px;max-height:720px;overflow:hidden;background:#141923}.sky{position:absolute;inset:0;background:linear-gradient(#10192b 0 48%,#30394a 48% 68%,#17191d 68%)}.arenaGlow{position:absolute;inset:14% 8% 41%;background:radial-gradient(ellipse,rgba(255,220,100,.16),transparent 65%)}.crowd{position:absolute;left:0;right:0;top:40%;height:19%;opacity:.55;background:radial-gradient(circle at 8px 8px,#08090b 0 7px,transparent 8px) 0 0/25px 23px}.banner{position:absolute;top:42%;left:8%;right:8%;height:8%;border-block:2px solid #777;background:#161b24;text-align:center;font-size:clamp(10px,1.4vw,16px);letter-spacing:.45em;padding-top:1.2%;opacity:.9}.floor{position:absolute;left:-12%;right:-12%;bottom:-19%;height:53%;background:linear-gradient(150deg,#34383e,#090a0c);transform:perspective(520px) rotateX(55deg);transform-origin:center top;border-top:4px solid #a5a5a5}.grid{position:absolute;left:0;right:0;bottom:8%;height:30%;background:repeating-linear-gradient(90deg,transparent 0 9%,rgba(255,255,255,.08) 9.2% 9.5%),repeating-linear-gradient(0deg,transparent 0 18%,rgba(255,255,255,.07) 18.2% 18.6%);transform:perspective(520px) rotateX(55deg)}.hud{position:absolute;z-index:30;top:17px;left:3%;right:3%;display:grid;grid-template-columns:1fr 100px 1fr;gap:12px;align-items:center}.name{font-size:clamp(12px,1.9vw,24px);font-weight:950;text-shadow:3px 3px #000;margin-bottom:5px}.r{text-align:right}.bar{height:clamp(17px,2.5vw,28px);border:3px solid #eee;background:#090909;box-shadow:0 3px #000}.hp{height:100%;width:100%;background:#e6cf35;transition:width .12s}.rbar .hp{margin-left:auto;background:#df5151}.energy{height:5px;margin-top:4px;background:#222;border:1px solid #555}.energy i{display:block;height:100%;width:0;background:#5ecbff;transition:width .12s}.timer{text-align:center;font-size:clamp(25px,4vw,46px);font-weight:1000;text-shadow:4px 4px #000}.low{color:#ff4b4b}.vs{position:absolute;z-index:31;top:75px;left:50%;transform:translateX(-50%) skew(-10deg);font-size:clamp(26px,4.5vw,55px);font-weight:1000;color:#f3d04a;text-shadow:4px 4px #000}.status{position:absolute;z-index:31;top:126px;left:50%;transform:translateX(-50%);font-size:clamp(10px,1.3vw,15px);opacity:.82;white-space:nowrap}.fighter{position:absolute;z-index:20;bottom:21%;width:100px;height:180px;transform-origin:50% 100%;will-change:left,transform;transition:filter .08s}.flip{transform:scaleX(-1)}.shadow{position:absolute;bottom:-7px;left:-5px;width:110px;height:21px;border-radius:50%;background:#0009}.p{position:absolute;image-rendering:pixelated}.head{left:34px;bottom:118px;width:42px;height:42px;border:4px solid #111;border-radius:45%;background:#dfa070;z-index:4}.hair{left:28px;bottom:145px;width:53px;height:23px;border:4px solid #111;border-bottom:0;border-radius:55% 55% 15% 15%;background:#24252b;z-index:5}.hair:after{content:'';position:absolute;left:4px;top:8px;width:9px;height:18px;background:#24252b;transform:rotate(22deg)}.body{left:30px;bottom:40px;width:49px;height:84px;border:4px solid #111;border-radius:10px;background:#a93632;z-index:3}.speed .body{background:#386fc3}.body:before{content:'';position:absolute;left:8px;top:12px;width:25px;height:9px;background:#f2d24c;border:2px solid #111}.speed .body:before{background:#9de8ff}.arm{top:57px;width:49px;height:17px;border:4px solid #111;border-radius:8px;background:#b93a34;transform-origin:8px 8px;z-index:2}.speed .arm{background:#3f79d2}.arm.l{left:-10px;transform:rotate(20deg)}.arm.r{right:-10px;transform:rotate(-20deg)}.arm:after{content:'';position:absolute;right:-8px;top:-2px;width:13px;height:13px;border:3px solid #111;border-radius:3px;background:#dfa070}.leg{bottom:0;width:18px;height:49px;border:4px solid #111;background:#2a2d35;transform-origin:9px 0;z-index:1}.leg.l{left:28px}.leg.r{left:60px}.label{position:absolute;bottom:-31px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;text-shadow:2px 2px #000}.att .arm.r{animation:punch .18s steps(2)}.att .arm.l{animation:backArm .18s steps(2)}.att2 .leg.r{animation:kick .22s steps(2)}.att2 .body{animation:lunge .22s steps(2)}.hurt{animation:hurt .18s}.hurt .head{animation:headHit .18s}.dodge{animation:dodge .28s}.jump{animation:jump .42s}.jump .arm.l{animation:airArm .42s}.jump .arm.r{animation:airArm2 .42s}.jump .leg.l{animation:airLeg .42s}.jump .leg.r{animation:airLeg2 .42s}.ko{animation:ko .7s forwards}.guard .body{filter:brightness(.58)}.guard .arm.l{transform:rotate(-55deg)}.guard .arm.r{transform:rotate(55deg)}.guard:after{content:'🛡';position:absolute;left:72px;top:62px;font-size:25px;filter:drop-shadow(2px 2px #000)}.special .body{animation:chargeBody .3s infinite alternate}.charge{position:absolute;z-index:18;font-weight:1000;color:#7de1ff;text-shadow:3px 3px #000;animation:up .6s forwards}.hit{position:absolute;z-index:19;font-size:34px;animation:spark .28s forwards}.combo{position:absolute;z-index:25;left:4%;bottom:17%;font-size:clamp(16px,2.4vw,30px);font-weight:1000;color:#f3d04a;text-shadow:3px 3px #000;opacity:0}.combo.show{animation:comboIn .7s forwards}.overlay{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.72);text-align:center}.overlay h1{font-size:clamp(38px,7vw,82px);margin:0;color:#f1d24c;text-shadow:6px 6px #000}.overlay p{font-size:clamp(13px,2vw,20px);opacity:.9}.start{padding:12px 30px;border:3px solid #fff;background:#1b1d22;color:#fff;font-weight:900;font-size:18px}.hint{position:absolute;z-index:25;bottom:10px;left:50%;transform:translateX(-50%);font-size:11px;opacity:.48;white-space:nowrap}@keyframes punch{50%{transform:translateX(30px) rotate(-8deg) scaleX(1.18)}}@keyframes backArm{50%{transform:rotate(42deg)}}@keyframes kick{50%{transform:translate(23px,-10px) rotate(-34deg)}}@keyframes lunge{50%{transform:translateX(5px)}}@keyframes headHit{50%{transform:translateX(-5px) rotate(-8deg)}}@keyframes hurt{50%{transform:translateX(-20px) rotate(-7deg)}}@keyframes dodge{50%{transform:translateX(24px) scale(.9) rotate(-8deg)}}@keyframes jump{50%{transform:translateY(-55px) rotate(-2deg)}}@keyframes airArm{50%{transform:rotate(-75deg)}}@keyframes airArm2{50%{transform:rotate(75deg)}}@keyframes airLeg{50%{transform:rotate(-18deg)}}@keyframes airLeg2{50%{transform:rotate(18deg)}}@keyframes chargeBody{to{filter:brightness(1.35) saturate(1.4)}}@keyframes ko{to{transform:rotate(82deg) translateY(25px);opacity:.7}}@keyframes up{to{transform:translateY(-40px);opacity:0}}@keyframes spark{to{transform:scale(1.7) rotate(15deg);opacity:0}}@keyframes comboIn{0%{opacity:0;transform:scale(.7)}30%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1)}}@media(max-width:600px){.hud{grid-template-columns:1fr 58px 1fr;gap:6px}.fighter{transform:scale(.82);transform-origin:50% 100%}.fighter.flip{transform:scaleX(-1) scale(.82)}} </style></head><body><main class="game"><div class="sky"></div><div class="arenaGlow"></div><div class="crowd"></div><div class="banner">AI FIGHTING CHAMPIONSHIP</div><div class="floor"></div><div class="grid"></div><section class="hud"><div><div class="name">赤焰 · 力量型 AI</div><div class="bar"><div id="hp1" class="hp"></div></div><div class="energy"><i id="en1"></i></div></div><div id="timer" class="timer">99</div><div><div class="name r">疾风 · 速度型 AI</div><div class="bar rbar"><div id="hp2" class="hp"></div></div><div class="energy"><i id="en2"></i></div></div></section><div class="vs">VS</div><div id="status" class="status">AI 正在分析战局……</div><div id="combo" class="combo"></div><div id="f1" class="fighter" style="left:22%"><i class="shadow"></i><i class="p head"></i><i class="p hair"></i><i class="p body"></i><i class="p arm l"></i><i class="p arm r"></i><i class="p leg l"></i><i class="p leg r"></i><b class="label">赤焰</b></div><div id="f2" class="fighter flip speed" style="left:72%"><i class="shadow"></i><i class="p head"></i><i class="p hair"></i><i class="p body"></i><i class="p arm l"></i><i class="p arm r"></i><i class="p leg l"></i><i class="p leg r"></i><b class="label">疾风</b></div><div id="overlay" class="overlay"><h1>争霸赛</h1><p>两个 AI · 自动格斗 · 纯观战</p><button id="start" class="start">开始观战</button></div><div class="hint">V1.7 · 原创像素动作 · 待机/攻击/受击/跳跃/防御/KO</div></main><script>(()=>{const $=id=>document.getElementById(id),G=document.querySelector('.game');const cfg={power:{speed:.48,reach:15,atk:[['轻拳',7,14,.12,.22,.38],['重拳',13,16,.20,.30,.72],['重脚',11,17,.18,.32,.62]],special:['烈焰冲击',24,21,.30,.22,1.55],style:'aggressive'},speed:{speed:.68,reach:15,atk:[['轻拳',6,14,.08,.18,.28],['重拳',10,16,.15,.25,.55],['重脚',9,18,.12,.25,.48]],special:['疾风连闪',19,22,.18,.30,1.25],style:'evasive'}};const names={idle:'观察对手',approach:'寻找距离',attack:'轻拳',heavy:'重拳',kick:'重脚',special:'必杀技',guard:'防御',dodge:'闪避',jump:'跳跃',hurt:'受击',ko:'KO'};function make(id,x,kind){return{id,x,hp:100,en:0,kind,face:id===1?1:-1,state:'idle',action:null,cool:0,stun:0,guard:0,dodge:0,jump:0,combo:0,comboT:0,ai:Math.random(),chain:0}}const A=make(1,22,'power'),B=make(2,72,'speed');let running=false,time=99,last=0,raf=0,fxs=[],shake=0;function node(f){return $(f.id===1?'f1':'f2')}function gap(){return Math.abs(A.x-B.x)}function visual(f,...c){const n=node(f);n.classList.remove('att','att2','guard','dodge','jump','hurt','ko','special');c.filter(Boolean).forEach(x=>n.classList.add(x))}function effect(x,y,text,cls='charge',life=.65){const e=document.createElement('div');e.className=cls;e.textContent=text;e.style.left=x+'%';e.style.top=y+'%';G.appendChild(e);fxs.push({e,t:life})}function showCombo(f){if(f.combo<2)return;const e=$('combo');e.textContent=f.combo+' HIT!';e.classList.remove('show');void e.offsetWidth;e.classList.add('show')}function clearAction(f){f.action=null;visual(f)}function begin(f,type,m){if(f.action||f.stun>0||f.cool>0||f.hp<=0)return false;f.state=type;f.action={n:m[0],d:m[1],r:m[2],w:m[3],a:m[4],t:0,hit:false,max:m[3]+m[4]+.34};f.cool=m[5];f.chain=0;visual(f,type==='attack'?'att':type==='heavy'||type==='kick'?'att2':type==='special'?'special':null);return true}function strike(f,e){const a=f.action;if(!a||a.hit||e.hp<=0)return;if(e.dodge>0||e.jump>0||gap()>a.r)return;a.hit=true;const blocked=e.guard>0,dmg=blocked?Math.max(1,Math.round(a.d*.18)):a.d;e.hp=Math.max(0,e.hp-dmg);e.stun=blocked?.08:(a.d>=20?.32:.20);e.state=e.hp<=0?'ko':blocked?'guard':'hurt';if(!blocked){e.x=Math.max(7,Math.min(93,e.x+f.face*(a.d>=20?3:1.2)));visual(e,'hurt')}else visual(e,'guard');f.en=Math.min(100,f.en+(blocked?2:dmg*1.35));f.combo++;f.comboT=1.05;e.combo=0;e.comboT=0;effect(e.x,48,'✦','hit',.3);effect(e.x,52,blocked?'GUARD':'-'+dmg,'charge',.65);if(a.n==='烈焰冲击'||a.n==='疾风连闪'){effect(f.x+f.face*5,44,'⚡','hit',.35);shake=Math.max(shake,.22)}if(!blocked)shake=Math.max(shake,a.d>=20?.16:.09);showCombo(f);clearAction(f)}function decide(f,e){if(f.action||f.stun>0||f.cool>0||f.hp<=0)return;const q=gap(),c=cfg[f.kind],style=c.style,incoming=['attack','heavy','kick','special'].includes(e.state);if(incoming&&q<22){const guardChance=style==='aggressive'?.10:.18;const dodgeChance=style==='evasive'?.22:.12;if(Math.random()<guardChance){f.guard=style==='aggressive'?.28:.42;f.state='guard';visual(f,'guard');f.cool=.35;return}if(style==='evasive'&&Math.random()<dodgeChance){f.dodge=.28;f.state='dodge';f.x=Math.max(7,Math.min(93,f.x+f.face*3.5));visual(f,'dodge');f.cool=.58;return}}if(q>c.reach){f.state='approach';f.x+=f.face*c.speed*(style==='aggressive'?1.05:1);return}if(q<7){f.state='approach';f.x-=f.face*(style==='evasive'?.85:.55);return}if(f.en>=100&&q<c.special[2]&&Math.random()<(style==='aggressive'?.48:.34)){f.en=0;begin(f,'special',c.special);return}if(style==='evasive'&&Math.random()<.13){f.state='jump';f.jump=.42;visual(f,'jump');f.cool=.58;return}const arr=c.atk;let r=Math.random();if(style==='aggressive')r=Math.min(1,r+.08);const m=r<.48?arr[0]:r<.73?arr[1]:arr[2];begin(f,m===arr[0]?'attack':m===arr[1]?'heavy':'kick',m)}function update(f,e,dt){f.cool=Math.max(0,f.cool-dt);f.stun=Math.max(0,f.stun-dt);f.guard=Math.max(0,f.guard-dt);f.dodge=Math.max(0,f.dodge-dt);f.jump=Math.max(0,f.jump-dt);f.comboT=Math.max(0,f.comboT-dt);if(!f.comboT)f.combo=0;if(f.hp<=0){f.state='ko';f.action=null;visual(f,'ko');return}if(f.guard<=0&&f.state==='guard')visual(f);if(f.dodge<=0&&f.state==='dodge')visual(f);if(f.jump<=0&&f.state==='jump')visual(f);if(f.stun>0)return;if(f.action){f.action.t+=dt;const a=f.action;if(a.t>=a.w&&a.t<a.w+a.a)strike(f,e);if(f.action&&a.t>=a.max)clearAction(f)}else if(f.guard<=0&&f.dodge<=0&&f.jump<=0){if(['hurt','guard','dodge','jump','ko'].includes(f.state))f.state='idle';decide(f,e)}}function resetF(f,x){f.x=x;f.hp=100;f.en=0;f.face=f.id===1?1:-1;f.state='idle';f.action=null;f.cool=0;f.stun=0;f.guard=0;f.dodge=0;f.jump=0;f.combo=0;f.comboT=0;f.ai=Math.random();f.chain=0;visual(f)}function render(){$('hp1').style.width=A.hp+'%';$('hp2').style.width=B.hp+'%';$('en1').style.width=A.en+'%';$('en2').style.width=B.en+'%';$('timer').textContent=Math.ceil(time);$('timer').classList.toggle('low',time<10);$('status').textContent='赤焰：'+names[A.state]+'　　VS　　疾风：'+names[B.state];node(A).style.left=A.x+'%';node(B).style.left=B.x+'%';if(shake>0){const n=(Math.random()-.5)*shake*120;G.style.transform='translate('+n+'px,'+n*.5+'px)'}else G.style.transform=''}function separate(){const d=B.x-A.x;if(Math.abs(d)<10){const s=(10-Math.abs(d))/2;if(d>=0){A.x-=s;B.x+=s}else{A.x+=s;B.x-=s}A.x=Math.max(7,Math.min(93,A.x));B.x=Math.max(7,Math.min(93,B.x))}}function end(){running=false;cancelAnimationFrame(raf);const w=A.hp===B.hp?'平局':A.hp>B.hp?'赤焰胜利！':'疾风胜利！';$('overlay').innerHTML='<h1>'+w+'</h1><p>本场 AI 对决结束</p><button id="start" class="start">再战一场</button>';$('overlay').style.display='flex';$('start').onclick=start}function loop(ts){if(!running)return;const dt=Math.min(.05,(ts-last)/1000||0);last=ts;time=Math.max(0,time-dt);shake=Math.max(0,shake-dt);A.face=B.x>=A.x?1:-1;B.face=A.x>=B.x?1:-1;update(A,B,dt);update(B,A,dt);separate();fxs=fxs.filter(o=>{o.t-=dt;if(o.t<=0){o.e.remove();return false}return true});render();if(time<=0||A.hp<=0||B.hp<=0){end();return}raf=requestAnimationFrame(loop)}function start(){fxs.forEach(o=>o.e.remove());fxs=[];shake=0;G.style.transform='';resetF(A,22);resetF(B,72);time=99;last=performance.now();$('overlay').style.display='none';running=true;cancelAnimationFrame(raf);raf=requestAnimationFrame(loop)}$('start').onclick=start})();</script></main></body></html>
