<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>争霸赛 · AI × AI</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b10;color:#fff;font-family:system-ui,"Microsoft YaHei",sans-serif}body{display:grid;place-items:center}.game{position:relative;width:100vw;height:56.25vw;max-width:1280px;max-height:720px;overflow:hidden;background:#141923;isolation:isolate}.sky{position:absolute;inset:0;background:linear-gradient(#10192b 0 48%,#30394a 48% 68%,#17191d 68%)}.arenaGlow{position:absolute;left:8%;right:8%;top:14%;height:45%;background:radial-gradient(ellipse,rgba(255,220,100,.14),transparent 65%)}.lights{position:absolute;top:5%;left:0;right:0;height:35%;background:repeating-linear-gradient(90deg,transparent 0 9%,rgba(255,255,255,.13) 9.2% 10%,transparent 10.2% 18%);mask-image:linear-gradient(#fff,transparent)}.crowd{position:absolute;left:0;right:0;top:40%;height:19%;opacity:.55;background:radial-gradient(circle at 8px 8px,#08090b 0 7px,transparent 8px) 0 0/25px 23px}.banner{position:absolute;top:42%;left:8%;right:8%;height:8%;border-block:2px solid #777;background:#161b24;text-align:center;font-size:clamp(10px,1.4vw,16px);letter-spacing:.45em;padding-top:1.2%;opacity:.9}.floor{position:absolute;left:-12%;right:-12%;bottom:-19%;height:53%;background:linear-gradient(150deg,#34383e,#090a0c);transform:perspective(520px) rotateX(55deg);transform-origin:center top;border-top:4px solid #a5a5a5}.grid{position:absolute;left:0;right:0;bottom:8%;height:30%;background:repeating-linear-gradient(90deg,transparent 0 9%,rgba(255,255,255,.08) 9.2% 9.5%),repeating-linear-gradient(0deg,transparent 0 18%,rgba(255,255,255,.07) 18.2% 18.6%);transform:perspective(520px) rotateX(55deg)}
.hud{position:absolute;z-index:20;top:17px;left:3%;right:3%;display:grid;grid-template-columns:1fr clamp(64px,9vw,110px) 1fr;gap:12px;align-items:center}.name{font-size:clamp(12px,1.9vw,24px);font-weight:950;text-shadow:3px 3px #000;margin-bottom:5px}.name.r{text-align:right}.bar{height:clamp(17px,2.5vw,28px);border:3px solid #eee;background:#090909;box-shadow:0 3px #000}.hp{height:100%;width:100%;background:#e6cf35;transition:width .15s}.rbar .hp{margin-left:auto;background:#df5151}.timer{text-align:center;font-size:clamp(25px,4vw,46px);font-weight:1000;text-shadow:4px 4px #000}.timer.low{color:#ff4b4b}.vs{position:absolute;z-index:21;top:75px;left:50%;transform:translateX(-50%) skew(-10deg);font-size:clamp(26px,4.5vw,55px);font-weight:1000;color:#f3d04a;text-shadow:4px 4px #000}.status{position:absolute;z-index:21;top:126px;left:50%;transform:translateX(-50%);font-size:clamp(10px,1.3vw,15px);opacity:.82;white-space:nowrap}.fighter{position:absolute;z-index:12;bottom:21%;width:100px;height:180px;transform-origin:50% 100%;will-change:left,transform}.fighter.flip{transform:scaleX(-1)}.shadow{position:absolute;bottom:-7px;left:-5px;width:110px;height:21px;border-radius:50%;background:#0009}.pixel{position:absolute;image-rendering:pixelated}.head{left:34px;bottom:118px;width:42px;height:42px;border:4px solid #111;border-radius:45%;background:#dfa070}.body{left:30px;bottom:40px;width:49px;height:84px;border:4px solid #111;border-radius:10px 10px 5px 5px;background:#a93632}.speed .body{background:#386fc3}.hair{left:30px;bottom:145px;width:48px;height:21px;border:4px solid #111;border-bottom:0;border-radius:50% 50% 0 0;background:#24252b}.arm{top:57px;width:49px;height:17px;border:4px solid #111;border-radius:8px;background:#b93a34;transform-origin:8px 8px}.speed .arm{background:#3f79d2}.arm.l{left:-10px;transform:rotate(20deg)}.arm.r{right:-10px;transform:rotate(-20deg)}.leg{bottom:0;width:18px;height:49px;border:4px solid #111;background:#2a2d35}.leg.l{left:28px}.leg.r{left:60px}.label{position:absolute;bottom:-31px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;text-shadow:2px 2px #000}.fighter.attack .arm.r{animation:punch .2s steps(2)}.fighter.attack2 .leg.r{animation:kick .25s steps(2)}.fighter.hurt{animation:hurt .18s}.fighter.dodge{animation:dodge .28s}.fighter.jump{animation:jump .4s}.fighter.ko{animation:ko .7s forwards}.fighter.guard .body{filter:brightness(.58)}.fighter.guard:after{content:'🛡';position:absolute;left:72px;top:62px;font-size:25px;filter:drop-shadow(2px 2px #000)}.fx{position:absolute;z-index:16;pointer-events:none;font-weight:1000;text-shadow:3px 3px #000;animation:float .65s forwards}.hitSpark{position:absolute;z-index:18;font-size:34px;animation:spark .28s forwards}.specialFx{position:absolute;z-index:17;font-size:42px;animation:special .5s forwards}.combo{position:absolute;z-index:22;left:4%;bottom:17%;font-size:clamp(16px,2.4vw,30px);font-weight:1000;color:#f3d04a;text-shadow:3px 3px #000;opacity:0}.combo.show{animation:comboIn .7s forwards}.overlay{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.72);text-align:center}.overlay h1{font-size:clamp(38px,7vw,82px);margin:0;color:#f1d24c;text-shadow:6px 6px #000}.overlay p{font-size:clamp(13px,2vw,20px);opacity:.9}.start{padding:12px 30px;border:3px solid #fff;background:#1b1d22;color:#fff;font-weight:900;font-size:18px;cursor:pointer}.hint{position:absolute;z-index:25;bottom:10px;left:50%;transform:translateX(-50%);font-size:11px;opacity:.48;white-space:nowrap}
@keyframes punch{50%{transform:translateX(24px) scaleX(1.2)}}@keyframes kick{50%{transform:translate(20px,-8px) rotate(-28deg)}}@keyframes hurt{50%{transform:translateX(-20px) rotate(-7deg)}}@keyframes dodge{50%{transform:translateX(24px) scale(.9)}}@keyframes jump{50%{transform:translateY(-55px)}}@keyframes ko{to{transform:rotate(82deg) translateY(25px);opacity:.7}}@keyframes float{to{transform:translateY(-45px);opacity:0}}@keyframes spark{to{transform:scale(1.7);opacity:0}}@keyframes special{to{transform:translateX(var(--dx)) scale(1.8);opacity:0}}@keyframes comboIn{0%{opacity:0;transform:scale(.7)}30%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1)}}
</style></head>
<body><main class="game"><div class="sky"></div><div class="arenaGlow"></div><div class="lights"></div><div class="crowd"></div><div class="banner">AI FIGHTING CHAMPIONSHIP</div><div class="floor"></div><div class="grid"></div>
<section class="hud"><div><div class="name">赤焰 · 力量型 AI</div><div class="bar"><div id="hp1" class="hp"></div></div></div><div id="timer" class="timer">99</div><div><div class="name r">疾风 · 速度型 AI</div><div class="bar rbar"><div id="hp2" class="hp"></div></div></div></section>
<div class="vs">VS</div><div id="status" class="status">AI 正在分析距离……</div><div id="combo" class="combo"></div>
<div id="f1" class="fighter" style="left:20%"><i class="shadow"></i><i class="pixel head"></i><i class="pixel hair"></i><i class="pixel body"></i><i class="pixel arm l"></i><i class="pixel arm r"></i><i class="pixel leg l"></i><i class="pixel leg r"></i><b class="label">赤焰</b></div>
<div id="f2" class="fighter flip speed" style="left:74%"><i class="shadow"></i><i class="pixel head"></i><i class="pixel hair"></i><i class="pixel body"></i><i class="pixel arm l"></i><i class="pixel arm r"></i><i class="pixel leg l"></i><i class="pixel leg r"></i><b class="label">疾风</b></div>
<div id="overlay" class="overlay"><h1>争霸赛</h1><p>两个 AI · 自动格斗 · 纯观战</p><button id="start" class="start">开始观战</button></div><div class="hint">V1.1 战斗系统原型 · 玩家无需操作</div></main>
<script>
const $=id=>document.getElementById(id);const P=(id,x,hp,kind)=>({id,x,hp,maxHp:hp,kind,face:id===1?1:-1,state:'idle',cool:0,stun:0,guard:0,combo:0,comboTimer:0,energy:0,air:0});const A=P(1,22,100,'power'),B=P(2,72,100,'speed');let running=false,time=99,last=0,round=1;
const names={idle:'观察对手',approach:'寻找进攻距离',attack:'普通攻击',heavy:'重拳',kick:'重脚',guard:'防御',dodge:'闪避',special:'必杀技',hurt:'受击'};
function d(){return Math.abs(A.x-B.x)}function pct(v){return Math.max(0,Math.min(100,v))}function el(f){return $(f.id===1?'f1':'f2')}
function say(t){$('status').textContent=t}
function effect(x,y,text,cls='fx'){const e=document.createElement('div');e.className=cls;e.textContent=text;e.style.left=x+'%';e.style.top=y+'%';document.querySelector('.game').appendChild(e);setTimeout(()=>e.remove(),700)}
function comboText(f){if(f.combo<2)return;const c=$('combo');c.textContent=f.combo+' HIT!';c.classList.remove('show');void c.offsetWidth;c.classList.add('show')}
function damage(att,def,amount,type){if(def.guard>0){amount=Math.round(amount*.2);effect(def.x,57,'GUARD','fx')}def.hp=pct(def.hp-amount);def.stun=type==='special'?.34:.18;def.state='hurt';def.x+=att.face*(type==='special'?2.2:1.1);def.combo=0;def.comboTimer=0;att.combo++;att.comboTimer=1.1;att.energy=Math.min(100,att.energy+amount*1.4);effect(def.x,53,'✦','hitSpark');if(type==='special')effect(att.x+(att.face*5),49,'⚡','specialFx');else effect(def.x,47,'-'+amount,'fx');el(def).classList.add('hurt');setTimeout(()=>el(def).classList.remove('hurt'),190)}
function doAction(f,e,type){if(f.cool>0||f.stun>0)return;f.state=type;let cd=.35;if(type==='attack'){cd=.42;damage(f,e,7,'normal');el(f).classList.add('attack');setTimeout(()=>el(f).classList.remove('attack'),220)}else if(type==='heavy'){cd=.72;damage(f,e,12,'heavy');el(f).classList.add('attack2');setTimeout(()=>el(f).classList.remove('attack2'),250)}else if(type==='kick'){cd=.62;damage(f,e,10,'heavy');el(f).classList.add('attack2');setTimeout(()=>el(f).classList.remove('attack2'),250)}else if(type==='special'){cd=1.55;f.energy=0;damage(f,e,22,'special');el(f).classList.add('attack');setTimeout(()=>el(f).classList.remove('attack'),300)}else if(type==='guard'){cd=.55;f.guard=.48;el(f).classList.add('guard');setTimeout(()=>{f.guard=0;el(f).classList.remove('guard')},500)}else if(type==='dodge'){cd=.8;f.x+=f.face*3.8;el(f).classList.add('dodge');setTimeout(()=>el(f).classList.remove('dodge'),300)}else if(type==='jump'){cd=.8;f.air=.45;el(f).classList.add('jump');setTimeout(()=>{f.air=0;el(f).classList.remove('jump')},420)}f.cool=cd;comboText(f)}
function choose(f,e,dt){if(f.cool>0||f.stun>0)return;const distance=d(),incoming=e.state==='attack'||e.state==='heavy'||e.state==='kick'||e.state==='special';if(distance>17){f.state='approach';f.x+=f.face*(f.kind==='speed'?.7:.52);return}if(distance<5){f.x-=f.face*.25}if(incoming&&Math.random()<.25){doAction(f,e,Math.random()<.55?'guard':'dodge');return}if(f.energy>=100&&distance<19&&Math.random()<.28){doAction(f,e,'special');return}if(f.kind==='power'){const r=Math.random();if(r<.28)doAction(f,e,'heavy');else if(r<.43)doAction(f,e,'kick');else doAction(f,e,'attack')}else{const r=Math.random();if(r<.2)doAction(f,e,'dodge');else if(r<.45)doAction(f,e,'attack');else if(r<.62)doAction(f,e,'kick');else doAction(f,e,'heavy')}}
function update(f,e,dt){f.cool=Math.max(0,f.cool-dt);f.stun=Math.max(0,f.stun-dt);f.comboTimer=Math.max(0,f.comboTimer-dt);if(f.comboTimer===0)f.combo=0;choose(f,e,dt);f.x=pct(f.x);el(f).style.left=f.x+'%';el(f).classList.toggle('flip',f.id===2);el(f).style.filter=f.stun>0?'brightness(.75)':'none'}
function render(){ $('hp1').style.width=A.hp+'%';$('hp2').style.width=B.hp+'%';$('timer').textContent=Math.ceil(time);$('timer').classList.toggle('low',time<10);if(A.state!=='idle'&&A.stun<=0)say('赤焰：'+names[A.state]);else if(B.state!=='idle'&&B.stun<=0)say('疾风：'+names[B.state]);}
function finish(){running=false;const winner=A.hp===B.hp?'平局':A.hp>B.hp?'赤焰':'疾风';if(A.hp<=0)el(A).classList.add('ko');if(B.hp<=0)el(B).classList.add('ko');$('overlay').innerHTML='<h1>'+winner+'</h1><p>'+winner+' 赢得本场 AI 对决</p><button class="start" onclick="location.reload()">重新观战</button>';render()}
function loop(ts){if(!running)return;const dt=Math.min(.05,(ts-last)/1000||0);last=ts;time-=dt;if(time<=0||A.hp<=0||B.hp<=0){finish();return}update(A,B,dt);update(B,A,dt);render();requestAnimationFrame(loop)}
$('start').onclick=()=>{$('overlay').style.display='none';running=true;last=performance.now();say('AI 正在分析战局……');requestAnimationFrame(loop)};render();
</script></body></html>
