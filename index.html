<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>争霸赛 · AI × AI</title><style>*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#090b10;color:#fff;font-family:system-ui,"Microsoft YaHei",sans-serif}body{display:grid;place-items:center}.game{position:relative;width:100vw;height:56.25vw;max-width:1280px;max-height:720px;overflow:hidden;background:#141923}.sky{position:absolute;inset:0;background:linear-gradient(#10192b 0 48%,#30394a 48% 68%,#17191d 68%)}.arenaGlow{position:absolute;inset:14% 8% 41%;background:radial-gradient(ellipse,rgba(255,220,100,.16),transparent 65%)}.crowd{position:absolute;left:0;right:0;top:40%;height:19%;opacity:.55;background:radial-gradient(circle at 8px 8px,#08090b 0 7px,transparent 8px) 0 0/25px 23px}.banner{position:absolute;top:42%;left:8%;right:8%;height:8%;border-block:2px solid #777;background:#161b24;text-align:center;font-size:clamp(10px,1.4vw,16px);letter-spacing:.45em;padding-top:1.2%;opacity:.9}.floor{position:absolute;left:-12%;right:-12%;bottom:-19%;height:53%;background:linear-gradient(150deg,#34383e,#090a0c);transform:perspective(520px) rotateX(55deg);transform-origin:center top;border-top:4px solid #a5a5a5}.grid{position:absolute;left:0;right:0;bottom:8%;height:30%;background:repeating-linear-gradient(90deg,transparent 0 9%,rgba(255,255,255,.08) 9.2% 9.5%),repeating-linear-gradient(0deg,transparent 0 18%,rgba(255,255,255,.07) 18.2% 18.6%);transform:perspective(520px) rotateX(55deg)}.hud{position:absolute;z-index:30;top:17px;left:3%;right:3%;display:grid;grid-template-columns:1fr 100px 1fr;gap:12px;align-items:center}.name{font-size:clamp(12px,1.9vw,24px);font-weight:950;text-shadow:3px 3px #000;margin-bottom:5px}.r{text-align:right}.bar{height:clamp(17px,2.5vw,28px);border:3px solid #eee;background:#090909;box-shadow:0 3px #000}.hp{height:100%;width:100%;background:#e6cf35;transition:width .12s}.rbar .hp{margin-left:auto;background:#df5151}.energy{height:5px;margin-top:4px;background:#222;border:1px solid #555}.energy i{display:block;height:100%;width:0;background:#5ecbff;transition:width .12s}.timer{text-align:center;font-size:clamp(25px,4vw,46px);font-weight:1000;text-shadow:4px 4px #000}.low{color:#ff4b4b}.vs{position:absolute;z-index:31;top:75px;left:50%;transform:translateX(-50%) skew(-10deg);font-size:clamp(26px,4.5vw,55px);font-weight:1000;color:#f3d04a;text-shadow:4px 4px #000}.status{position:absolute;z-index:31;top:126px;left:50%;transform:translateX(-50%);font-size:clamp(10px,1.3vw,15px);opacity:.82;white-space:nowrap}.fighter{position:absolute;z-index:20;bottom:21%;width:100px;height:180px;transform-origin:50% 100%;will-change:left,transform}.flip{transform:scaleX(-1)}.shadow{position:absolute;bottom:-7px;left:-5px;width:110px;height:21px;border-radius:50%;background:#0009}.p{position:absolute;image-rendering:pixelated}.head{left:34px;bottom:118px;width:42px;height:42px;border:4px solid #111;border-radius:45%;background:#dfa070}.body{left:30px;bottom:40px;width:49px;height:84px;border:4px solid #111;border-radius:10px;background:#a93632}.speed .body{background:#386fc3}.hair{left:30px;bottom:145px;width:48px;height:21px;border:4px solid #111;border-bottom:0;border-radius:50% 50% 0 0;background:#24252b}.arm{top:57px;width:49px;height:17px;border:4px solid #111;border-radius:8px;background:#b93a34;transform-origin:8px 8px}.speed .arm{background:#3f79d2}.arm.l{left:-10px;transform:rotate(20deg)}.arm.r{right:-10px;transform:rotate(-20deg)}.leg{bottom:0;width:18px;height:49px;border:4px solid #111;background:#2a2d35}.leg.l{left:28px}.leg.r{left:60px}.label{position:absolute;bottom:-31px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;text-shadow:2px 2px #000}.att .arm.r{animation:punch .18s steps(2)}.att2 .leg.r{animation:kick .22s steps(2)}.hurt{animation:hurt .18s}.dodge{animation:dodge .28s}.jump{animation:jump .4s}.ko{animation:ko .7s forwards}.guard .body{filter:brightness(.58)}.guard:after{content:'🛡';position:absolute;left:72px;top:62px;font-size:25px}.charge{position:absolute;z-index:18;font-weight:1000;color:#7de1ff;text-shadow:3px 3px #000;animation:up .6s forwards}.hit{position:absolute;z-index:19;font-size:34px;animation:spark .28s forwards}.combo{position:absolute;z-index:25;left:4%;bottom:17%;font-size:clamp(16px,2.4vw,30px);font-weight:1000;color:#f3d04a;text-shadow:3px 3px #000;opacity:0}.combo.show{animation:comboIn .7s forwards}.overlay{position:absolute;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.72);text-align:center}.overlay h1{font-size:clamp(38px,7vw,82px);margin:0;color:#f1d24c;text-shadow:6px 6px #000}.overlay p{font-size:clamp(13px,2vw,20px);opacity:.9}.start{padding:12px 30px;border:3px solid #fff;background:#1b1d22;color:#fff;font-weight:900;font-size:18px}.hint{position:absolute;z-index:25;bottom:10px;left:50%;transform:translateX(-50%);font-size:11px;opacity:.48;white-space:nowrap}@keyframes punch{50%{transform:translateX(25px) scaleX(1.2)}}@keyframes kick{50%{transform:translate(20px,-8px) rotate(-28deg)}}@keyframes hurt{50%{transform:translateX(-20px) rotate(-7deg)}}@keyframes dodge{50%{transform:translateX(24px) scale(.9)}}@keyframes jump{50%{transform:translateY(-55px)}}@keyframes ko{to{transform:rotate(82deg) translateY(25px);opacity:.7}}@keyframes up{to{transform:translateY(-40px);opacity:0}}@keyframes spark{to{transform:scale(1.7);opacity:0}}@keyframes comboIn{0%{opacity:0;transform:scale(.7)}30%{opacity:1;transform:scale(1.1)}100%{opacity:0;transform:scale(1)}}@media(max-width:600px){.hud{grid-template-columns:1fr 58px 1fr;gap:6px}.fighter{transform:scale(.82);transform-origin:50% 100%}.fighter.flip{transform:scaleX(-1) scale(.82)}} </style></head><body><main class="game"><div class="sky"></div><div class="arenaGlow"></div><div class="crowd"></div><div class="banner">AI FIGHTING CHAMPIONSHIP</div><div class="floor"></div><div class="grid"></div><section class="hud"><div><div class="name">赤焰 · 力量型 AI</div><div class="bar"><div id="hp1" class="hp"></div></div><div class="energy"><i id="en1"></i></div></div><div id="timer" class="timer">99</div><div><div class="name r">疾风 · 速度型 AI</div><div class="bar rbar"><div id="hp2" class="hp"></div></div><div class="energy"><i id="en2"></i></div></div></section><div class="vs">VS</div><div id="status" class="status">AI 正在分析战局……</div><div id="combo" class="combo"></div><div id="f1" class="fighter" style="left:20%"><i class="shadow"></i><i class="p head"></i><i class="p hair"></i><i class="p body"></i><i class="p arm l"></i><i class="p arm r"></i><i class="p leg l"></i><i class="p leg r"></i><b class="label">赤焰</b></div><div id="f2" class="fighter flip speed" style="left:74%"><i class="shadow"></i><i class="p head"></i><i class="p hair"></i><i class="p body"></i><i class="p arm l"></i><i class="p arm r"></i><i class="p leg l"></i><i class="p leg r"></i><b class="label">疾风</b></div><div id="overlay" class="overlay"><h1>争霸赛</h1><p>两个 AI · 自动格斗 · 纯观战</p><button id="start" class="start">开始观战</button></div><div class="hint">V1.2.1 战斗锁死修复 · 玩家无需操作</div></main><script>const $=id=>document.getElementById(id);const cfg={power:{speed:.48,reach:15,atk:[{n:'轻拳',d:7,r:14,w:.12,a:.22,c:.38},{n:'重拳',d:13,r:16,w:.2,a:.3,c:.72},{n:'重脚',d:11,r:17,w:.18,a:.32,c:.62}],special:{n:'烈焰冲击',d:24,r:21,w:.3,a:.22,c:1.55}},speed:{speed:.68,reach:15,atk:[{n:'轻拳',d:6,r:14,w:.08,a:.18,c:.28},{n:'重拳',d:10,r:16,w:.15,a:.25,c:.55},{n:'重脚',d:9,r:18,w:.12,a:.25,c:.48}],special:{n:'疾风连闪',d:19,r:22,w:.18,a:.3,c:1.25}}};function F(id,x,kind){return{id,x,hp:100,en:0,kind,face:id===1?1:-1,state:'idle',action:null,cool:0,stun:0,guard:0,dodge:0,jump:0,combo:0,comboT:0,hitDone:false,lock:0}}const A=F(1,22,'power'),B=F(2,72,'speed');let running=false,time=99,last=0;const names={idle:'观察对手',approach:'寻找距离',attack:'轻拳',heavy:'重拳',kick:'重脚',special:'必杀技',guard:'防御',dodge:'闪避',jump:'跳跃',hurt:'受击'};function dist(){return Math.abs(A.x-B.x)}function node(f){return $(f.id===1?'f1':'f2')}function fx(x,y,s,cl='charge'){let e=document.createElement('div');e.className=cl;e.textContent=s;e.style.left=x+'%';e.style.top=y+'%';$('.game').appendChild(e);setTimeout(()=>e.remove(),650)}function showCombo(f){if(f.combo<2)return;let e=$('combo');e.textContent=f.combo+' HIT!';e.classList.remove('show');void e.offsetWidth;e.classList.add('show')}function clearAction(f){f.action=null;f.lock=0;node(f).classList.remove('att','att2')}function startAction(f,type,move){if(f.cool>0||f.stun>0||f.action)return false;f.state=type;f.action={move,elapsed:0};f.hitDone=false;f.lock=move.w+move.a+.12;f.cool=move.c;node(f).classList.toggle('att',type==='attack'||type==='special');node(f).classList.toggle('att2',type==='heavy'||type==='kick');return true}function strike(f,e){let m=f.action.move;if(f.hitDone||f.dodge>0||f.jump>0)return;let gap=dist();if(gap>m.r)return;f.hitDone=true;let blocked=e.guard>0;let dmg=blocked?Math.max(1,Math.round(m.d*.18)):m.d;e.hp=Math.max(0,e.hp-dmg);e.stun=blocked?.08:(m.n.includes('疾风')?.14:m.d>=20?.32:.2);e.state=blocked?'guard':'hurt';if(!blocked){e.x+=f.face*(m.d>=20?3:1.2);e.x=Math.max(7,Math.min(93,e.x))}e.action=null;e.lock=0;e.cool=Math.max(e.cool,.12);node(e).classList.remove('att','att2');f.en=Math.min(100,f.en+(blocked?2:dmg*1.35));f.combo++;f.comboT=1.05;e.combo=0;e.comboT=0;fx(e.x,52,blocked?'GUARD':'-'+dmg,'charge');fx(e.x,48,'✦','hit');if(m.n.includes('烈焰')||m.n.includes('疾风'))fx(f.x+f.face*5,44,'⚡','hit');showCombo(f)}function finish(){running=false;let w=A.hp===B.hp?'平局':A.hp>B.hp?'赤焰':'疾风';if(A.hp<=0)node(A).classList.add('ko');if(B.hp<=0)node(B).classList.add('ko');$('overlay').innerHTML='<h1>'+w+'</h1><p>'+w+' 赢得本场 AI 对决</p><button class="start" onclick="location.reload()">重新观战</button>'}function choose(f,e){if(f.cool>0||f.stun>0||f.action)return;let q=dist(),incoming=['attack','heavy','kick','special'].includes(e.state);if(incoming&&q<22&&Math.random()<.16){f.guard=.38;f.state='guard';node(f).classList.add('guard');setTimeout(()=>{f.guard=0;node(f).classList.remove('guard')},400);f.cool=.45;return}if(incoming&&f.kind==='speed'&&Math.random()<.1){f.dodge=.28;f.state='dodge';f.x+=f.face*3.5;f.x=Math.max(7,Math.min(93,f.x));node(f).classList.add('dodge');setTimeout(()=>{f.dodge=0;node(f).classList.remove('dodge')},300);f.cool=.7;return}if(q>cfg[f.kind].reach){f.state='approach';f.x+=f.face*cfg[f.kind].speed;return}if(q<7){f.x-=f.face*.5;return}if(f.en>=100&&q<cfg[f.kind].special.r&&Math.random()<.3){f.en=0;startAction(f,'special',cfg[f.kind].special);return}if(Math.random()<.08){f.state='jump';f.jump=.4;node(f).classList.add('jump');setTimeout(()=>{f.jump=0;node(f).classList.remove('jump')},420);f.cool=.65;return}let r=Math.random(),arr=cfg[f.kind].atk,m=r<.42?arr[0]:r<.7?arr[1]:arr[2];startAction(f,m===arr[0]?'attack':m===arr[1]?'heavy':'kick',m)}function update(f,e,dt){f.cool=Math.max(0,f.cool-dt);f.stun=Math.max(0,f.stun-dt);f.comboT=Math.max(0,f.comboT-dt);if(!f.comboT)f.combo=0;if(f.guard>0)f.guard=Math.max(0,f.guard-dt);if(f.dodge>0)f.dodge=Math.max(0,f.dodge-dt);if(f.action){f.action.elapsed+=dt;f.lock=Math.max(0,f.lock-dt);let t=f.action.elapsed,m=f.action.move;if(t>=m.w&&t<m.w+m.a)strike(f,e);if(f.action&&t>=m.w+m.a){clearAction(f);f.state='idle'}else if(f.action&&f.lock<=0){clearAction(f);f.state='idle'}}else if(f.stun<=0)choose(f,e);if(!f.action&&f.stun<=0&&f.state==='hurt')f.state='idle';f.x=Math.max(7,Math.min(93,f.x));node(f).style.left=f.x+'%';node(f).classList.toggle('flip',f.id===2);node(f).style.filter=f.stun>0?'brightness(.7)':''}function render(){$('hp1').style.width=A.hp+'%';$('hp2').style.width=B.hp+'%';$('en1').style.width=A.en+'%';$('en2').style.width=B.en+'%';$('timer').textContent=Math.ceil(time);$('timer').classList.toggle('low',time<10);let f=A.action||A.stun>0?A:B;say(f.id===1?'赤焰：'+names[f.state]:'疾风：'+names[f.state])}function say(s){$('status').textContent=s}function loop(ts){if(!running)return;let dt=Math.min(.05,(ts-last)/1000||0);last=ts;time-=dt;if(time<=0||A.hp<=0||B.hp<=0){finish();render();return}A.face=B.x>A.x?1:-1;B.face=A.x>B.x?1:-1;update(A,B,dt);update(B,A,dt);render();requestAnimationFrame(loop)}$('start').onclick=()=>{$('overlay').style.display='none';running=true;last=performance.now();requestAnimationFrame(loop)};render();</script></body></html>
