name: Apply Arena Background

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply uploaded arena background
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          marker = '<!-- ARENA_BG_V1 -->'
          image = 'https://raw.githubusercontent.com/liulinsen89-collab/zheng-ba-sai/main/file_0000000095e48209a656a2b8cabe98f3.png'

          # Use the raw GitHub image URL so the Pages site does not depend on
          # project-path resolution or Pages asset handling for this PNG.
          for old in [
              "url('./file_0000000095e48209a656a2b8cabe98f3.png')",
              'url("./file_0000000095e48209a656a2b8cabe98f3.png")',
              "url('/zheng-ba-sai/file_0000000095e48209a656a2b8cabe98f3.png')",
              'url("/zheng-ba-sai/file_0000000095e48209a656a2b8cabe98f3.png")'
          ]:
              s = s.replace(old, f"url('{image}')")

          if marker not in s:
              css = f'''<style id="arena-bg-v1">
          /* ARENA_BG_V1: use the user's uploaded martial-arts arena image as the battle background */
          .game{{background:#0b1220 linear-gradient(rgba(0,0,0,.12),rgba(0,0,0,.12)),url('{image}') center center/cover no-repeat!important}}
          .scene.sky,.scene.moon,.scene.mountain,.scene.palace,.scene.waterfall,.scene.mist,.scene.cherry,.scene.lantern,.scene.banner,.scene.platform,.scene.floor{{display:none!important}}
          </style>'''
              s = s.replace('</head>', marker + css + '</head>', 1)

          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit source change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if git diff --quiet -- index.html; then
            echo 'No source changes needed.'
            exit 0
          fi
          git add index.html
          git commit -m 'fix: load arena background from raw GitHub asset'
          git push

# Background source marker: ARENA_BG_V3
