name: Energy Overdrive Balance

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply slower energy and super burst
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          if 'ENERGY_OVERDRIVE_V1' in s:
              print('Energy Overdrive already applied; nothing to do.')
              raise SystemExit(0)

          old = "const blocked=e.guard>0,baseDmg=blocked?Math.max(1,Math.round(a.d*.18)):a.d,dmg=Math.max(1,Math.round(baseDmg*.5));"
          new = "const blocked=e.guard>0,baseDmg=blocked?Math.max(1,Math.round(a.d*.18)):a.d,isSpecial=a.n==='烈焰冲击'||a.n==='疾风连闪',dmg=isSpecial?220:Math.max(1,Math.round(baseDmg*.5));"
          if old not in s:
              raise SystemExit('damage formula not found')
          s = s.replace(old, new, 1)

          old = "f.en=Math.min(100,f.en+(blocked?2:baseDmg*1.35));"
          new = "f.en=Math.min(100,f.en+(blocked?.7:Math.max(.45,baseDmg*.38)));"
          if old not in s:
              raise SystemExit('energy gain formula not found')
          s = s.replace(old, new, 1)

          old = "if(f.en>=100&&q<c.special[2]&&Math.random()<(style==='aggressive'?.48:.34)){f.en=0;begin(f,'special',c.special);return}"
          new = "if(f.en>=100&&q<c.special[2]){f.en=0;begin(f,'special',c.special);return}"
          if old not in s:
              raise SystemExit('special trigger not found')
          s = s.replace(old, new, 1)

          old = "function strike(f,e){"
          s = s.replace(old, "/* ENERGY_OVERDRIVE_V1 */function strike(f,e){", 1)
          p.write_text(s, encoding='utf-8')
          print('Energy Overdrive applied.')
          PY

      - name: Commit patched source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "balance: slower energy and super burst [energy-patched]"
          git push
