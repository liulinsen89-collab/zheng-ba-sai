name: Special Effects V1

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  enhance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add dramatic special effects
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          marker='SPECIAL_EFFECTS_V1'
          if marker in s:
              print('Special Effects V1 already applied.')
              raise SystemExit(0)

          css='''<style id="special-effects-v1">
          .special.fx-active .sprite{animation:specialBody .42s steps(5) infinite alternate!important;filter:brightness(1.8) saturate(1.9) drop-shadow(0 0 18px #fff)!important}
          .special-charge{position:absolute;z-index:45;left:50%;top:48%;width:130px;height:130px;transform:translate(-50%,-50%);border:5px solid #fff;border-radius:50%;opacity:0;pointer-events:none;animation:specialCharge .48s ease-out forwards}
          .special-charge.fire{background:radial-gradient(circle,#fff8 0 8%,#ffcf4d88 18%,#ff5b2499 42%,transparent 70%);box-shadow:0 0 25px #ff5b24,0 0 70px #ffb52e}
          .special-charge.wind{background:radial-gradient(circle,#fff 0 5%,#bff4ff88 16%,#38cfff66 40%,transparent 70%);box-shadow:0 0 30px #5be6ff,0 0 80px #6fcfff}
          .special-beam{position:absolute;z-index:43;height:34px;border-radius:50%;transform-origin:left center;pointer-events:none;opacity:0;animation:specialBeam .34s ease-out forwards}
          .special-beam.fire{background:linear-gradient(90deg,#fff,#ffe45c,#ff6a21,transparent);box-shadow:0 0 18px #ff7b28,0 0 42px #ffb52e}
          .special-beam.wind{background:linear-gradient(90deg,#fff,#8ff5ff,#36bfff,transparent);box-shadow:0 0 18px #55eaff,0 0 42px #48cfff}
          .special-ring{position:absolute;z-index:44;left:50%;top:50%;width:40px;height:40px;transform:translate(-50%,-50%);border:7px solid #fff;border-radius:50%;pointer-events:none;animation:specialRing .52s cubic-bezier(.1,.7,.2,1) forwards}
          .special-ring.fire{border-color:#ff9a2e;box-shadow:0 0 20px #ff5a24,inset 0 0 20px #ffd45a}
          .special-ring.wind{border-color:#7eefff;box-shadow:0 0 20px #32d8ff,inset 0 0 20px #bffaff}
          .special-flash{position:absolute;z-index:59;inset:0;background:#fff;opacity:0;pointer-events:none;animation:specialFlash .16s ease-out forwards}
          .special-title{position:absolute;z-index:58;left:50%;top:31%;transform:translate(-50%,-50%) skew(-8deg) scale(.35);font-size:clamp(28px,6vw,72px);font-weight:1000;letter-spacing:.08em;color:#fff;text-shadow:4px 4px #000,0 0 18px currentColor;opacity:0;pointer-events:none;white-space:nowrap;animation:specialTitle .7s cubic-bezier(.12,.8,.2,1) forwards}
          .special-title.fire{color:#ffcf4d}.special-title.wind{color:#8defff}
          .special-damage{position:absolute;z-index:58;font-size:clamp(28px,4.5vw,58px);font-weight:1000;color:#fff;text-shadow:4px 4px #000,0 0 14px #ffcf4d;pointer-events:none;animation:specialDamage .72s ease-out forwards}
          @keyframes specialBody{to{transform:scale(1.05) translateY(-3px)}}
          @keyframes specialCharge{0%{opacity:0;transform:translate(-50%,-50%) scale(.25) rotate(0)}35%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) scale(1.45) rotate(180deg)}}
          @keyframes specialBeam{0%{opacity:0;transform:scaleX(.05)}25%{opacity:1}100%{opacity:0;transform:scaleX(1)}}
          @keyframes specialRing{to{width:360px;height:360px;opacity:0;border-width:2px}}
          @keyframes specialFlash{0%{opacity:0}20%{opacity:.72}100%{opacity:0}}
          @keyframes specialTitle{0%{opacity:0;transform:translate(-50%,-50%) skew(-8deg) scale(.35)}22%{opacity:1;transform:translate(-50%,-50%) skew(-8deg) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50%) skew(-8deg) scale(1)}}
          @keyframes specialDamage{0%{opacity:0;transform:translateY(12px) scale(.55)}25%{opacity:1;transform:translateY(0) scale(1.18)}100%{opacity:0;transform:translateY(-45px) scale(1)}}
          </style>'''

          if '</head>' not in s:
              raise SystemExit('head marker not found')
          s=s.replace('</head>',css+'\n</head>',1)

          old="function strike(f,e){const a=f.action;if(!a||a.hit||e.hp<=0)return;if(e.dodge>0||e.jump>0||gap()>a.r)return;a.hit=true;"
          new="""function specialFX(f,e){const fire=f.id===1,kind=fire?'fire':'wind',x=e.x,y=48;visual(f,'special','fx-active');const flash=document.createElement('div');flash.className='special-flash';G.appendChild(flash);fxs.push({e:flash,t:.18});const title=document.createElement('div');title.className='special-title '+kind;title.textContent=f.id===1?'烈焰冲击':'疾风连闪';G.appendChild(title);fxs.push({e:title,t:.72});const c=document.createElement('div');c.className='special-charge '+kind;c.style.left=x+'%';c.style.top=y+'%';G.appendChild(c);fxs.push({e:c,t:.5});const ring=document.createElement('div');ring.className='special-ring '+kind;ring.style.left=x+'%';ring.style.top=y+'%';G.appendChild(ring);fxs.push({e:ring,t:.54});const beam=document.createElement('div');beam.className='special-beam '+kind;beam.style.left=(fire?Math.max(3,x-4):Math.min(97,x+4))+'%';beam.style.top=y+'%';beam.style.width=(fire?48:48)+'%';beam.style.transform=fire?'rotate(0deg)':'rotate(180deg)';G.appendChild(beam);fxs.push({e:beam,t:.38});shake=Math.max(shake,.34);time=Math.max(0,time-.3)}\n\n"""+old
          if old not in s:
              raise SystemExit('strike marker not found')
          s=s.replace(old,new,1)

          old2="a.hit=true;const blocked=e.guard>0,baseDmg=blocked?Math.max(1,Math.round(a.d*.18)):a.d,isSpecial=a.n==='烈焰冲击'||a.n==='疾风连闪',dmg=isSpecial?210:Math.max(1,Math.round(baseDmg*.5));"
          new2="a.hit=true;const blocked=e.guard>0,baseDmg=blocked?Math.max(1,Math.round(a.d*.18)):a.d,isSpecial=a.n==='烈焰冲击'||a.n==='疾风连闪',dmg=isSpecial?210:Math.max(1,Math.round(baseDmg*.5));if(isSpecial)specialFX(f,e);"
          if old2 not in s:
              raise SystemExit('damage marker not found')
          s=s.replace(old2,new2,1)

          old3="effect(e.x,53,blocked?'GUARD':'-'+dmg);"
          new3="effect(e.x,53,blocked?'GUARD':'-'+dmg);if(isSpecial){const sd=document.createElement('div');sd.className='special-damage';sd.textContent='-'+dmg;sd.style.left=Math.max(8,Math.min(86,e.x))+'%';sd.style.top='54%';G.appendChild(sd);fxs.push({e:sd,t:.74})}"
          if old3 not in s:
              raise SystemExit('damage effect marker not found')
          s=s.replace(old3,new3,1)

          s=s.replace('SPECIAL_EFFECTS_V1','SPECIAL_EFFECTS_V1',1)
          s=s.replace('/* ENERGY_OVERDRIVE_V1 */ /* ENERGY_TUNING_V2 */', '/* ENERGY_OVERDRIVE_V1 */ /* ENERGY_TUNING_V2 */ /* SPECIAL_EFFECTS_V1 */',1)
          p.write_text(s,encoding='utf-8')
          print('Applied SPECIAL_EFFECTS_V1')
          PY

      - name: Commit source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "feat: dramatic special move effects"
          git push
