name: Deploy 争霸赛 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Apply V1.9.1 visible combo system
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''.combo{left:50%!important;bottom:24%!important;transform:translateX(-50%);font-size:clamp(18px,2.8vw,34px)!important;color:#f4d45b!important;text-shadow:3px 3px #000,0 0 10px #f4d45b!important;z-index:60!important}.combo.show{animation:comboIn .7s forwards!important}.combo-badge{position:absolute;z-index:65;pointer-events:none;font-weight:1000;font-size:clamp(16px,2.4vw,30px);font-style:italic;text-shadow:3px 3px #000;opacity:0;white-space:nowrap}.combo-badge.f1{color:#ff5148}.combo-badge.f2{color:#52b9ff}.combo-badge.show{animation:comboPop .65s ease-out forwards}@keyframes comboPop{0%{opacity:0;transform:translate(-50%,8px) scale(.7)}25%{opacity:1;transform:translate(-50%,0) scale(1.12)}100%{opacity:0;transform:translate(-50%,-28px) scale(1)}}.fighter.combo-hit .sprite{filter:drop-shadow(0 0 12px #fff) drop-shadow(0 6px 3px #0007)!important}'''
          s=s.replace('</style>',css+'</style>',1)
          js=r'''
          (function(){
            const oldDecide=decide;
            const chainState={1:{busy:false,index:0,seq:[]},2:{busy:false,index:0,seq:[]}};
            const lastHp={1:A.hp,2:B.hp};
            const hitWindow={1:0,2:0};
            const comboCount={1:0,2:0};
            const comboExpire={1:0,2:0};
            function badge(f,n){
              if(n<2)return;
              const e=document.createElement('div');e.className='combo-badge '+(f.id===1?'f1':'f2');e.textContent=n+' HIT COMBO';
              const r=node(f).getBoundingClientRect(),g=G.getBoundingClientRect();
              e.style.left=((r.left+r.width/2-g.left)/g.width*100)+'%';
              e.style.top=Math.max(8,(r.top-g.top)/g.height*100-10)+'%';
              G.appendChild(e);requestAnimationFrame(()=>e.classList.add('show'));setTimeout(()=>e.remove(),700);
            }
            function startChain(f,e){
              const st=chainState[f.id]; if(st.busy||f.action||f.stun>0||f.cool>0||f.hp<=0||e.hp<=0)return false;
              const c=cfg[f.kind];
              st.seq=f.kind==='power'?[c.atk[0],c.atk[1],c.atk[3]]:[c.atk[0],c.atk[2],c.atk[0]];
              st.index=0;st.busy=true;
              const next=()=>{
                if(!running||f.hp<=0||e.hp<=0||st.index>=st.seq.length){st.busy=false;return}
                const m=st.seq[st.index++];
                const type=m===c.atk[0]?'attack':m===c.atk[1]?'heavy':m===c.atk[2]?'lightkick':'kick';
                if(!begin(f,type,m)){st.busy=false;return}
                const started=performance.now();
                const wait=()=>{
                  if(!running||f.hp<=0||e.hp<=0){st.busy=false;return}
                  if(f.action){if(performance.now()-started>650){clearAction(f);setTimeout(next,90)}else requestAnimationFrame(wait)}
                  else setTimeout(next,90);
                };requestAnimationFrame(wait);
              };next();return true;
            }
            decide=function(f,e){
              if(f.action||f.stun>0||f.cool>0||f.hp<=0)return;
              const d=Math.abs(f.x-e.x);
              if(d<=14 && d>=8 && Math.random()<(f.kind==='power'?.34:.30) && startChain(f,e))return;
              return oldDecide(f,e);
            };
            function hpCheck(){
              const now=performance.now();
              if(A.hp<lastHp[1]){comboCount[1]=now<comboExpire[1]?comboCount[1]+1:1;comboExpire[1]=now+1100;badge(A,comboCount[1]);A.node=node(A);A.node.classList.add('combo-hit');setTimeout(()=>A.node&&A.node.classList.remove('combo-hit'),160)}
              if(B.hp<lastHp[2]){comboCount[2]=now<comboExpire[2]?comboCount[2]+1:1;comboExpire[2]=now+1100;badge(B,comboCount[2]);B.node=node(B);B.node.classList.add('combo-hit');setTimeout(()=>B.node&&B.node.classList.remove('combo-hit'),160)}
              lastHp[1]=A.hp;lastHp[2]=B.hp;
            }
            setInterval(hpCheck,50);
          })();
          '''
          marker='})();</script>'
          if marker not in s: raise SystemExit('game script marker not found')
          s=s.replace(marker,js+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
