name: Deploy 争霸赛 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build V3.3 real combat arbiter
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')

          # Expose the real game objects. The original source uses
          # window.A=make(...),B=make(...), so B is not reliably exposed
          # through the same mechanism used by the earlier V3.2 layer.
          s=re.sub(r'\bconst\s+cfg\s*=', 'window.cfg=', s, count=1)
          s=re.sub(r'\blet\s+cfg\s*=', 'window.cfg=', s, count=1)
          s=re.sub(r'window\.A\s*=\s*([^;]+),\s*B\s*=', r'window.A=\1,window.B=', s, count=1)
          s=re.sub(r'\bconst\s+A\s*=', 'window.A=', s, count=1)
          s=re.sub(r'\blet\s+A\s*=', 'window.A=', s, count=1)
          s=re.sub(r'\bconst\s+B\s*=', 'window.B=', s, count=1)
          s=re.sub(r'\blet\s+B\s*=', 'window.B=', s, count=1)

          marker='__v33_real_combat_arbiter'
          patch=r'''<script id="__v33_real_combat_arbiter">
          (()=>{
            document.title='争霸赛 · V3.3 AI Core';
            const T=()=>performance.now();
            const LIVE=new Set(['attack','att','heavy','kick','lightkick','special']);
            const S={A:{lastState:'',lastMove:'',moveSame:0,dodgeSame:0,attacks:0,switchAt:0},B:{lastState:'',lastMove:'',moveSame:0,dodgeSame:0,attacks:0,switchAt:0}};
            function arr(f){return (window.cfg&&window.cfg[f.kind]&&window.cfg[f.kind].atk)||['jab','heavy','kick','lightkick']}
            function forceAttack(f,e,key){
              if(!f||!e||f.hp<=0||e.hp<=0||typeof begin!=='function')return;
              const a=arr(f), idx=(S[key].attacks + (key==='A'?2:3))%a.length;
              f.action=null; f.cool=0; f.dodge=0; f.guard=0; f.jump=0; f.state='idle';
              begin(f,'attack',a[idx]);
              S[key].attacks++;
              S[key].switchAt=T();
            }
            function tick(f,e,key){
              if(!f||!e||f.hp<=0||e.hp<=0)return;
              const q=S[key], st=f.state||'', act=f.action, move=act&&act.n||'';
              const dist=Math.abs((f.x||0)-(e.x||0));

              if(st===q.lastState) q.moveSame++; else {q.lastState=st;q.moveSame=0}
              if(st==='dodge') q.dodgeSame++; else if(st!=='dodge') q.dodgeSame=0;
              if(move===q.lastMove) q.moveSame++; else if(move){q.lastMove=move;q.moveSame=1}

              // Never interrupt an active animation. Decide immediately after it ends.
              if(act) return;

              // Two consecutive dodge decisions at close range -> attack next.
              if(dist<145 && q.dodgeSame>=2){q.dodgeSame=0;q.moveSame=0;forceAttack(f,e,key);return}

              // Three repeats of the same move -> rotate the attack immediately after recovery.
              if(dist<180 && q.moveSame>=3){q.moveSame=0;forceAttack(f,e,key);return}

              // No action for too long -> attack instead of stalling.
              if(dist<190 && (st==='idle'||st==='dodge') && T()-q.switchAt>900){q.dodgeSame=0;q.moveSame=0;forceAttack(f,e,key);return}

              // Long range: pursue. Close range: stop backing away and let the normal AI choose.
              if(dist>190){
                const dir=e.x>f.x?1:-1;
                f.vx=dir*(key==='B'?1.55:1.25);
                if(q.moveSame>7)f.vx*=1.35;
              }
            }
            setInterval(()=>{if(window.A&&window.B){tick(window.A,window.B,'A');tick(window.B,window.A,'B')}},120);
          })();
          </script>'''
          if marker not in s:
              s=s.replace('</body>',patch+'</body>') if '</body>' in s else s+patch
          p.write_text(s,encoding='utf-8')
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# V3.3 real combat arbiter deployment
