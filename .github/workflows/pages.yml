name: Deploy 争霸赛 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Apply V1.9 combo combat
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css='''.combo{left:50%!important;bottom:25%!important;transform:translateX(-50%);font-size:clamp(16px,2.4vw,30px)!important;color:#f4d45b!important;text-shadow:3px 3px #000!important}.combo.show{animation:comboIn .7s forwards!important}.fighter.combo-hit .sprite{filter:drop-shadow(0 0 10px #fff) drop-shadow(0 6px 3px #0007)!important}'''
          s=s.replace('</style>',css+'</style>',1)
          combo_js=r'''<script>
          (function(){
            const oldDecide=decide;
            const chainTimer={1:null,2:null};
            function doChain(f,e){
              if(f.action||f.stun>0||f.cool>0||f.hp<=0)return;
              const c=cfg[f.kind];
              const seq=f.kind==='power' ? [c.atk[0],c.atk[1],c.atk[3]] : [c.atk[0],c.atk[2],c.atk[0]];
              let i=0;
              function next(){
                if(!running||f.hp<=0||e.hp<=0||i>=seq.length)return;
                const m=seq[i++];
                const type=m===c.atk[0]?'attack':m===c.atk[1]?'heavy':m===c.atk[2]?'lightkick':'kick';
                if(begin(f,type,m)){
                  f.chain=i;
                  chainTimer[f.id]=setTimeout(()=>{if(running)next()},Math.max(190,m[5]*1000+170));
                }
              }
              next();
            }
            decide=function(f,e){
              if(f.action||f.stun>0||f.cool>0||f.hp<=0)return;
              const q=Math.abs(f.x-e.x);
              if(q<=18 && q>=9 && Math.random()<(f.kind==='power'?.22:.18)){
                doChain(f,e);return;
              }
              return oldDecide(f,e);
            };
          })();
          </script>'''
          marker='})();</script>'
          if marker not in s:
              raise SystemExit('game script marker not found')
          s=s.replace(marker,combo_js+'<script>(function(){})();</script>'+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
