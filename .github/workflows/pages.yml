name: Deploy 争霸赛 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Apply V2.0 signature specials
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          css=r'''
          .special-burst{position:absolute;z-index:55;pointer-events:none;width:180px;height:180px;border-radius:50%;opacity:0;transform:translate(-50%,-50%) scale(.25);mix-blend-mode:screen}.special-burst.red{background:radial-gradient(circle,#fff 0 8%,#ffb347 12%,#ff3b30 28%,transparent 70%);filter:drop-shadow(0 0 18px #ff3b30)}.special-burst.blue{background:radial-gradient(circle,#fff 0 8%,#c9f5ff 12%,#38a8ff 30%,transparent 72%);filter:drop-shadow(0 0 18px #38a8ff)}.special-burst.go{animation:specBurst .65s steps(6) forwards}.special-ring{position:absolute;z-index:54;pointer-events:none;width:24px;height:24px;border:7px solid #fff;border-radius:50%;opacity:0;transform:translate(-50%,-50%)}.special-ring.go{animation:specRing .55s ease-out forwards}.special-label{position:absolute;z-index:70;pointer-events:none;font-weight:1000;font-size:clamp(15px,2.2vw,28px);opacity:0;transform:translate(-50%,0) scale(.7);text-shadow:3px 3px #000}.special-label.red{color:#ff4b3e}.special-label.blue{color:#55c8ff}.special-label.go{animation:specLabel .85s ease-out forwards}.special-flash{position:absolute;inset:0;z-index:52;pointer-events:none;background:#fff;opacity:0}.special-flash.go{animation:specFlash .18s steps(2)}
          @keyframes specBurst{0%{opacity:0;transform:translate(-50%,-50%) scale(.2)}25%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.8)}}
          @keyframes specRing{0%{opacity:1;width:24px;height:24px}100%{opacity:0;width:230px;height:230px}}
          @keyframes specLabel{0%{opacity:0;transform:translate(-50%,0) scale(.7)}18%{opacity:1;transform:translate(-50%,0) scale(1.08)}100%{opacity:0;transform:translate(-50%,-22px) scale(1)}}
          @keyframes specFlash{0%{opacity:0}35%{opacity:.72}100%{opacity:0}}
          .fighter.special .sprite{filter:drop-shadow(0 0 14px #fff) drop-shadow(0 8px 4px #0008)!important}
          '''
          s=s.replace('</style>',css+'</style>',1)
          js=r'''
          (function(){
            const game=document.querySelector('.game');
            const originalBegin=begin;
            const specialState={1:false,2:false};
            function burst(f,e){
              const n=node(f),r=n.getBoundingClientRect(),g=game.getBoundingClientRect();
              const x=(r.left+r.width/2-g.left)/g.width*100, y=(r.top+r.height*.45-g.top)/g.height*100;
              const side=f.id===1?'red':'blue';
              const b=document.createElement('div');b.className='special-burst '+side+' go';b.style.left=x+'%';b.style.top=y+'%';game.appendChild(b);
              const ring=document.createElement('div');ring.className='special-ring go';ring.style.left=x+'%';ring.style.top=y+'%';game.appendChild(ring);
              const lab=document.createElement('div');lab.className='special-label '+side+' go';lab.textContent=(f.id===1?'赤焰 · 必杀技':'疾风 · 必杀技');lab.style.left=x+'%';lab.style.top=Math.max(10,y-13)+'%';game.appendChild(lab);
              const fl=document.createElement('div');fl.className='special-flash go';game.appendChild(fl);
              setTimeout(()=>{b.remove();ring.remove();lab.remove();fl.remove()},900);
            }
            begin=function(f,type,m){
              const ok=originalBegin(f,type,m);
              if(ok && type==='special') burst(f,f.id===1?B:A);
              return ok;
            };
            const oldUpdate=update;
            update=function(f,e){
              oldUpdate(f,e);
              if(f.action && f.action.type==='special' && !specialState[f.id]){specialState[f.id]=true}
              if((!f.action || f.action.type!=='special') && specialState[f.id])specialState[f.id]=false;
            };
          })();
          '''
          marker='})();</script>'
          if marker not in s: raise SystemExit('game script marker not found')
          s=s.replace(marker,js+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
