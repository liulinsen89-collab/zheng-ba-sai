name: Deploy 争霸赛 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Apply final spectator layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          css='''.hud{top:4px!important}.name{font-size:clamp(9px,1.25vw,16px)!important;margin-bottom:1px!important}.bar{height:9px!important;border-width:2px!important;transform:translateY(-2px)}.energy{height:3px!important;transform:translateY(-2px)}.status,.spectator{display:none!important}.action-callout{z-index:55;display:block;pointer-events:none;font-weight:1000;font-size:clamp(10px,1.35vw,17px);white-space:nowrap;text-shadow:2px 2px #000;animation:callout .43s ease-out forwards}.action-callout.f1{color:#ff3b30!important;text-shadow:2px 2px #000,0 0 5px #ff3b30!important}.action-callout.f2{color:#38a8ff!important;text-shadow:2px 2px #000,0 0 5px #38a8ff!important}.fighter .scarf{display:none!important}.fighter .boot{bottom:11px!important;z-index:4!important}.fighter .boot.l{left:43px!important}.fighter .boot.r{left:98px!important}.kick .shin.r,.kick .boot.r{animation:frontKick .30s steps(4);transform-origin:50% 100%}.lightkick .shin.r,.lightkick .boot.r{animation:lightKick .24s steps(4);transform-origin:50% 100%}.jump .shin.l{animation:airLL .46s}.jump .shin.r{animation:airLR .46s}.jump .boot.l{animation:airLL .46s}.jump .boot.r{animation:airLR .46s}'''
          s=s.replace("</style>",css+"</style>",1)
          s=s.replace('style="left:21%"','style="left:8%"',2)
          s=s.replace('style="left:69%"','style="left:78%"',2)
          s=s.replace("const A=make(1,21,'power'),B=make(2,69,'speed')","const A=make(1,8,'power'),B=make(2,78,'speed')")
          s=s.replace("resetF(A,21);resetF(B,69)","resetF(A,8);resetF(B,78)")
          s=s.replace('reach:17,atk:', 'reach:11,atk:')
          old_strike="""function strike(f,e){const a=f.action;if(!a||a.hit||e.hp<=0)return;if(e.dodge>0||e.jump>0||gap()>a.r)return;a.hit=true;const blocked=e.guard>0,dmg=blocked?Math.max(1,Math.round(a.d*.18)):a.d;e.hp=Math.max(0,e.hp-dmg);e.stun=blocked?.08:(a.d>=20?.32:.20);e.state=e.hp<=0?'ko':blocked?'guard':'hurt';if(!blocked)visual(e,'hurt');else visual(e,'guard');f.en=Math.min(100,f.en+(blocked?2:dmg*1.35));f.combo++;f.comboT=1.05;e.combo=0;e.comboT=0;burst(e.x,48,a.d>=20);effect(e.x,53,blocked?'GUARD':'-'+dmg);if(a.n==='烈焰冲击'||a.n==='疾风连闪')burst(e.x,46,true);shake=Math.max(shake,a.d>=20?.18:.09);if(a.d>=20)time=Math.max(0,time-.12);showCombo(f);clearAction(f)}"""
          new_strike="""function strike(f,e){const a=f.action;if(!a||a.hit||e.hp<=0)return;const dist=Math.abs(f.x-e.x);const reach=Math.min(a.r,11.5);if(e.dodge>0||e.jump>0||dist>reach)return;const dir=e.x>=f.x?1:-1;if(f.face!==dir&&dist>4)return;a.hit=true;const blocked=e.guard>0,dmg=blocked?Math.max(1,Math.round(a.d*.18)):Math.max(1,a.d);e.hp=Math.max(0,e.hp-dmg);e.stun=blocked?.08:(a.d>=20?.32:.20);e.state=e.hp<=0?'ko':blocked?'guard':'hurt';if(!blocked)visual(e,'hurt');else visual(e,'guard');f.en=Math.min(100,f.en+(blocked?2:dmg*1.35));f.combo++;f.comboT=1.05;e.combo=0;e.comboT=0;f.chain=(f.chain||0)+1;if(f.chain>=3)f.chain=0;burst(e.x,48,a.d>=20);effect(e.x,53,blocked?'GUARD':'-'+dmg);if(a.n==='烈焰冲击'||a.n==='疾风连闪')burst(e.x,46,true);shake=Math.max(shake,a.d>=20?.18:.09);if(a.d>=20)time=Math.max(0,time-.12);showCombo(f);clearAction(f)}"""
          if old_strike not in s: raise SystemExit('strike function not found')
          s=s.replace(old_strike,new_strike,1)
          old_loop="""function loop(ts){if(!running)return;const dt=Math.min(.05,(ts-last)/1000||0);last=ts;time=Math.max(0,time-dt);shake=Math.max(0,shake-dt);A.face=B.x>=A.x?1:-1;B.face=A.x>=B.x?1:-1;update(A,B,dt);update(B,A,dt);separate();fxs=fxs.filter(o=>{o.t-=dt;if(o.t<=0){o.e.remove();return false}return true});render();if(time<=0||A.hp<=0||B.hp<=0){end();return}raf=requestAnimationFrame(loop)}"""
          new_loop="""function loop(ts){if(!running)return;const dt=Math.min(.05,(ts-last)/1000||0);last=ts;time=Math.max(0,time-dt);shake=Math.max(0,shake-dt);A.face=B.x>=A.x?1:-1;B.face=A.x>=B.x?1:-1;update(A,B,dt);update(B,A,dt);separate();A.x=Math.max(7,Math.min(93,A.x));B.x=Math.max(7,Math.min(93,B.x));fxs=fxs.filter(o=>{o.t-=dt;if(o.t<=0){o.e.remove();return false}return true});render();if(time<=0||A.hp<=0||B.hp<=0){end();return}raf=requestAnimationFrame(loop)}"""
          if old_loop not in s: raise SystemExit('loop function not found in source')
          s=s.replace(old_loop,new_loop,1)
          personality="""\n          // V1.8: recognizable personalities plus short attack chains.\n          decide=function(f,e){\n            if(f.action||f.stun>0||f.cool>0||f.hp<=0)return;\n            const q=gap(),c=cfg[f.kind],aggressive=f.kind==='power';\n            const incoming=['attack','heavy','lightkick','kick','special'].includes(e.state);\n            if(aggressive){\n              if(q>c.reach){f.state='approach';f.x+=f.face*c.speed*1.18;return}\n              if(q<8.8){f.state='approach';f.x-=f.face*.42;return}\n              if(incoming&&q<13&&Math.random()<.10){f.guard=.30;f.state='guard';visual(f,'guard');f.cool=.32;return}\n              if(f.en>=100&&q<=11.5&&Math.random()<.62){f.en=0;begin(f,'special',c.special);return}\n              const chain=f.chain||0;\n              const m=chain===0?c.atk[0]:chain===1?c.atk[1]:(Math.random()<.58?c.atk[3]:c.atk[2]);\n              const type=m===c.atk[0]?'attack':m===c.atk[1]?'heavy':m===c.atk[2]?'lightkick':'kick';\n              begin(f,type,m);return;\n            }\n            if(q<10.5){\n              if(Math.random()<.34){f.dodge=.30;f.state='dodge';f.x=Math.max(7,Math.min(93,f.x+f.face*3.8));visual(f,'dodge');f.cool=.58;return}\n              f.state='approach';f.x-=f.face*.55;return\n            }\n            if(q>14.5){f.state='approach';f.x+=f.face*c.speed*.92;return}\n            if(incoming&&q<16){\n              if(Math.random()<.30){f.dodge=.30;f.state='dodge';f.x=Math.max(7,Math.min(93,f.x+f.face*3.2));visual(f,'dodge');f.cool=.60;return}\n              if(Math.random()<.18){f.guard=.40;f.state='guard';visual(f,'guard');f.cool=.36;return}\n            }\n            if(f.en>=100&&q<=12&&Math.random()<.48){f.en=0;begin(f,'special',c.special);return}\n            const m=Math.random()<.48?c.atk[0]:Math.random()<.62?c.atk[2]:Math.random()<.72?c.atk[1]:c.atk[3];\n            const type=m===c.atk[0]?'attack':m===c.atk[1]?'heavy':m===c.atk[2]?'lightkick':'kick';\n            begin(f,type,m);\n          };\n          """
          marker='})();</script>'
          if marker not in s: raise SystemExit('script end marker not found')
          s=s.replace(marker,personality+'})();</script>',1)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
