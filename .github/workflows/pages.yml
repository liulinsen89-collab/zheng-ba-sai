name: Deploy 争霸赛 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Apply V2.1 battle balance and guaranteed specials
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text(encoding='utf-8')
          patch=r'''
          (function(){
            const HP_MAX=300;
            const DAMAGE_SCALE=.42;
            const SPECIAL_ENERGY=60;
            A.maxHp=HP_MAX; B.maxHp=HP_MAX; A.hp=HP_MAX; B.hp=HP_MAX;
            function rebalance(f){
              if(f.action && typeof f.action.d==='number') f.action.d=Math.max(1,Math.round(f.action.d*DAMAGE_SCALE));
              if(f.energy>=SPECIAL_ENERGY && (!f.action || f.action.type!=='special')) begin(f,'special');
            }
            const oldReset=resetF;
            resetF=function(f,x){oldReset(f,x);f.maxHp=HP_MAX;f.hp=HP_MAX;f.energy=0};
            const oldStrike=strike;
            strike=function(f,e){
              if(f.action && typeof f.action.d==='number') f.action.d=Math.max(1,Math.round(f.action.d*DAMAGE_SCALE));
              return oldStrike(f,e);
            };
            const oldUpdate=update;
            update=function(f,e){
              oldUpdate(f,e);
              if(f.energy>=SPECIAL_ENERGY && (!f.action || f.action.type!=='special')) begin(f,'special');
            };
            const oldRender=render;
            render=function(){
              oldRender();
              const bars=document.querySelectorAll('.hp');
              if(bars[0])bars[0].style.width=Math.max(0,Math.min(100,A.hp/HP_MAX*100))+'%';
              if(bars[1])bars[1].style.width=Math.max(0,Math.min(100,B.hp/HP_MAX*100))+'%';
            };
            A.hp=HP_MAX;B.hp=HP_MAX;A.maxHp=HP_MAX;B.maxHp=HP_MAX;
            render();
          })();
          '''
          marker='})();</script>'
          if marker not in s: raise SystemExit('game script marker not found')
          s=s.replace(marker,patch+marker,1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
