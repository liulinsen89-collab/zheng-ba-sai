name: Deploy 争霸赛 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Apply final spectator layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          css='''.hud{top:4px!important}.name{font-size:clamp(9px,1.25vw,16px)!important;margin-bottom:1px!important}.bar{height:9px!important;border-width:2px!important;transform:translateY(-2px)}.energy{height:3px!important;transform:translateY(-2px)}.status,.spectator{display:none!important}.action-callout{position:absolute;z-index:55;display:none;pointer-events:none;font-size:clamp(9px,1.1vw,13px);font-weight:900;white-space:nowrap;background:#0009;padding:2px 6px;border-radius:3px;border:1px solid #ffffff44}.action-callout.f1{color:#ff3b30;text-shadow:2px 2px 0 #000,0 0 5px #ff3b30}.action-callout.f2{color:#38a8ff;text-shadow:2px 2px 0 #000,0 0 5px #38a8ff}.action-callout.on{display:block;animation:calloutIn .16s ease-out forwards}@keyframes calloutIn{from{opacity:0;transform:translateY(5px) scale(.92)}to{opacity:1;transform:translateY(0) scale(1)}}'''
          s=s.replace('</style>',css+'</style>',1)
          js='''<script>(function(){function boot(){var g=document.querySelector('.game'),status=document.getElementById('status'),fs=[document.getElementById('f1'),document.getElementById('f2')];if(!g||!status||!fs[0]||!fs[1])return;var boxes=fs.map(function(f,i){var d=document.createElement('div');d.className='action-callout f'+(i+1);g.appendChild(d);return d}),last=['',''],timers=[0,0];function parse(text){var m=text.match(/赤焰：(.+?)\\s+VS\\s+疾风：(.+)/);return m?[m[1].trim(),m[2].trim()]:['','']}function label(a){return ({'轻拳':'轻拳','重拳':'重拳','轻脚':'轻脚','重脚':'重脚','必杀技':'特殊技','防御':'防御','闪避':'闪避','跳跃':'跳跃'})[a]||''}function place(i){var r=fs[i].getBoundingClientRect(),gr=g.getBoundingClientRect();boxes[i].style.left=(r.left-gr.left+r.width*.5)+'px';boxes[i].style.top=(r.top-gr.top+r.height*.05-16)+'px';boxes[i].style.transform='translateX(-50%)'}function update(){var a=parse(status.textContent||'');a.forEach(function(v,i){var l=label(v);if(l!==last[i]){last[i]=l;clearTimeout(timers[i]);boxes[i].classList.remove('on');if(l){boxes[i].textContent=(i===0?'赤焰':'疾风')+' · '+l;place(i);boxes[i].classList.add('on');var delay=l==='特殊技'?700:430;timers[i]=setTimeout(function(){boxes[i].classList.remove('on')},delay)}}else if(l)place(i)});requestAnimationFrame(update)}update()}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot()} )();</script><script>document.addEventListener('click',function(e){if(e.target.closest('.start')){var v=document.querySelector('.vs');if(v)v.style.display='none'}});</script>'''
          if '</body>' in s and 'function boot(){var g=document.querySelector(\'.game\')' not in s:
            s=s.replace('</body>',js+'</body>',1)
          p.write_text(s,encoding='utf-8')
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
