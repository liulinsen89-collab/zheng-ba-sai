name: Deploy 争霸赛 to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Apply final spectator layout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path("index.html")
          s=p.read_text(encoding="utf-8")
          css='''.hud{top:4px!important}.name{font-size:clamp(9px,1.25vw,16px)!important;margin-bottom:1px!important}.bar{height:9px!important;border-width:2px!important;transform:translateY(-2px)}.energy{height:3px!important;transform:translateY(-2px)}.status,.spectator{display:none!important}.action-callout{position:absolute;z-index:55;display:block;pointer-events:none;font-weight:1000;font-size:clamp(10px,1.35vw,17px);white-space:nowrap;transform:translate(-50%,0);animation:callout .43s ease-out forwards;text-shadow:2px 2px #000}.action-callout.f1{color:#ff3b30!important;text-shadow:2px 2px #000,0 0 5px #ff3b30!important}.action-callout.f2{color:#38a8ff!important;text-shadow:2px 2px #000,0 0 5px #38a8ff!important}.fighter .scarf{display:none!important}.fighter .boot{bottom:11px!important;z-index:4!important}.fighter .boot.l{left:43px!important}.fighter .boot.r{left:98px!important}.kick .shin.r,.kick .boot.r{animation:frontKick .30s steps(4);transform-origin:50% 100%}.lightkick .shin.r,.lightkick .boot.r{animation:lightKick .24s steps(4);transform-origin:50% 100%}.jump .shin.l{animation:airLL .46s}.jump .shin.r{animation:airLR .46s}.jump .boot.l{animation:airLL .46s}.jump .boot.r{animation:airLR .46s}@keyframes callout{0%{opacity:0;transform:translate(-50%,6px) scale(.9)}15%{opacity:1;transform:translate(-50%,0) scale(1)}72%{opacity:1;transform:translate(-50%,-3px) scale(1)}100%{opacity:0;transform:translate(-50%,-12px) scale(.96)}}'''
          s=s.replace("</style>",css+"</style>",1)
          js='''<script>(function(){function label(t){t=(t||"").trim();if(!t)return null;var m=t.match(/赤焰：(.+?)\\s*VS\\s*疾风：(.+)/);if(!m)return null;return [[m[1],1],[m[2],2]]}function show(text,idx){var game=document.querySelector(".game"),f=document.querySelector(idx===1?".fighter.p1":".fighter.p2");if(!game||!f||!text)return;var r=f.getBoundingClientRect(),g=game.getBoundingClientRect(),el=document.createElement("div");el.className="action-callout f"+idx;el.textContent=text;el.style.left=(r.left+r.width/2-g.left)+"px";el.style.top=Math.max(62,r.top-g.top+12)+"px";game.appendChild(el);setTimeout(function(){el.remove()},520)}function hook(){var s=document.querySelector(".status");if(!s)return;var last="";function check(){var t=s.textContent||"",a=label(t);if(a&&t!==last){last=t;a.forEach(function(x){if(x[0]&&!/待机|接近|后退|追击/.test(x[0]))show(x[0],x[1])})}}new MutationObserver(check).observe(s,{childList:true,subtree:true,characterData:true});setInterval(check,120)}if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",hook);else hook()})();</script>'''
          s=s.replace("</body>",js+"</body>",1)
          p.write_text(s,encoding="utf-8")
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
